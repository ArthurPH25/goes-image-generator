# ==============================================================================
# CONFIGURAÇÃO DAS PALETAS DE CORES (GOES-16 / GOES-19)
# ==============================================================================
# Regras gerais:
# 1. Cada banda térmica do instrumento ABI (canais 7 a 16) tem sua própria
#    seção no formato [PALETTE_BAND_XX]. Os canais 1 a 6 (refletância) não têm
#    paleta: saem sempre em tons de cinza.
# 2. As chaves são os valores físicos medidos pelo satélite (ex: Temperatura
#    de Brilho em °C). O script faz uma interpolação linear suave entre todas
#    as cores.
# 3. Formato obrigatório: Valor_Fisico_Inteiro = Cor. A cor pode ser
#    hexadecimal (#RRGGBB, o recomendado) ou um nome de cor do matplotlib.
# 4. As chaves devem ser números inteiros (ex: -63). Não inventa moda de usar
#    casa decimal, senão vai causar erro fatal de conversão e o script falha.
#    Fora isso, é livre: você escolhe quantas chaves quiser e o espaçamento
#    entre elas pode ser irregular (ex: -63, -72, -73, -100), em qualquer
#    canal. Os degraus de 10 em 10 (20 em 20 no canal 7) das paletas abaixo
#    são só o padrão do arquivo, não uma exigência.
# 5. O script lê cada seção de forma isolada. As bandas 11 a 16  usam a mesma 
#    paleta aqui embaixo apenas por padrão visual. Você pode alterar as cores
#    do Canal 13 à vontade sem medo de quebrar as outras.
# 6. Cada seção PALETTE_BAND_XX precisa de pelo menos 2 chaves diferentes (a
#    interpolação linear precisa de um mínimo e um máximo). PALETTE_GLM precisa
#    sempre da chave "default"; se glm_flash_age = True, precisa também de pelo
#    menos 1 chave numérica de idade.
# 7. A menor e a maior chave de cada seção definem os limites da escala: valores
#    medidos fora desse intervalo saem com a cor da ponta correspondente. Esses
#    limites também definem a barra de cores lateral. Os passos de 20°C (canal
#    7) e de 10°C (demais canais) valem só pras marcas dessa barra: não limitam
#    as suas chaves nem a interpolação. As marcas começam na menor chave e
#    avançam nesse passo, então se ela não for múltipla dele (ex: -63) as
#    marcas saem em números quebrados (-63, -53, -43...). Prefira uma menor
#    chave múltipla do passo (ex: -90 nos canais de 10°C, -100 no canal 7). A
#    barra só existe nas imagens de canal ABI (no GLM com fundo ela não é
#    desenhada).
# 8. Comentários só valem em linhas próprias, começando com #. Comentário na
#    mesma linha do valor vira parte do valor e causa erro. Salve em UTF-8.

# ------------------------------------------------------------------------------
# CANAL 07: INFRAVERMELHO ONDAS CURTAS / JANELA TÉRMICA E FOGO (3.9 µm)
# ------------------------------------------------------------------------------
# Sensível a focos de calor/incêndios, nevoeiro noturno e superfície.
# - Fogo (+60°C a +100°C): vermelho, magenta e branco.
# - Superfície (+40°C a -20°C): escala de cinza.
# - Nuvens frias (-40°C a -80°C): ciano, azul e branco.
[PALETTE_BAND_07]
100 = #FFFFFF
80 = #FF00FF
60 = #FF0000
40 = #1A1A1A
20 = #444444
0 = #888888
-20 = #CCCCCC
-40 = #00FFFF
-60 = #0000FF
-80 = #FFFFFF

# ------------------------------------------------------------------------------
# CANAL 08: VAPOR D'ÁGUA TROPOSFERA SUPERIOR (6.2 µm)
# ------------------------------------------------------------------------------
# Mede a umidade na camada superior da troposfera.
# - Ar seco/quente (-20°C a +10°C): do vermelho escuro ao laranja.
# - Intermediário (-30°C a -40°C): amarelo e verde.
# - Ar úmido/frio (-50°C a -70°C): ciano, azul e roxo.
[PALETTE_BAND_08]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ------------------------------------------------------------------------------
# CANAL 09: VAPOR D'ÁGUA TROPOSFERA MÉDIA (6.9 µm)
# ------------------------------------------------------------------------------
# Mede a umidade na camada média da troposfera.
[PALETTE_BAND_09]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

