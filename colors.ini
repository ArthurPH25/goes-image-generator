g_band_a = C13
g_band_b = C07
g_min = -3.1
g_max = 5.2
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C13
b_min = -29.6
b_max = 19.5
b_gamma = 1.0
b_invert = False

# ------------------------------------------------------------------------------
# SEVERE STORMS RGB (Day Convection): só faz sentido de dia (usa canais visível e 3.9 µm)
# ------------------------------------------------------------------------------
# R = WV6.2(C08) - WV7.3(C10) | G = IR3.9(C07) - IRW(C13) | B = NIR1.6(C05) - VIS0.6(C02)
# Faixas do Day Convection RGB do guia NOAA/CIRA, da JMA e do SEVIRI (versão
# de latitudes médias). O EUMETSAT tem uma variante mais recente para o FCI, com
# faixas mais estreitas (R -30 a 0, G 0 a 55, B -70 a 20). Nos trópicos o EUMETSAT
# sugere G de -5 a 75 com gama 0.33, porque o original deixa topos demais amarelos.
# O guia NOAA lista gama 1 no verde; EUMETSAT e JMA usam 0.5. Bandas C05 e C02 em %.
[RGB_SEVERE_STORMS]
r_mode = difference
r_band_a = C08
r_band_b = C10
r_min = -35
r_max = 5
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C07
g_band_b = C13
g_min = -5
g_max = 60
g_gamma = 0.5
g_invert = False
b_mode = difference
b_band_a = C05
b_band_b = C02
b_min = -75
b_max = 25
b_gamma = 1.0
b_invert = False

# ------------------------------------------------------------------------------
# OVERSHOOTING TOPS RGB (receita experimental): topos que penetram a tropopausa
# ------------------------------------------------------------------------------
# R = WV6.2(C08) - IRW(C13) | G = O3(C12) - IRW(C13) | B = WV6.2(C08) invertido
# Esta não é uma receita publicada pela EUMETSAT, NOAA ou CIRA. Foi inspirada no
# Airmass e no Tropical Airmass (o ajuste da EUMETSAT para topos frios, que alarga
# o verde para -25 a +25 K no SEVIRI), mas troca o par do vermelho (C08 - C13, em
# vez de C08 - C10) e usa faixas próprias: verde de -30 a 25 e azul de -30.15 °C a
# -83.15 °C (243 K a 190 K), com o mais frio ficando mais azul. Como min tem que
# ser menor que max, o azul vira b_invert = True. Topos em overshoot aparecem em
# tons claros/brancos. Trate como visualização experimental e confira contra uma
# imagem de referência antes de tirar conclusões. Se quiser uma receita com fonte
# publicada, use AIRMASS.
[RGB_OVERSHOOTING_TOPS]
r_mode = difference
r_band_a = C08
r_band_b = C13
r_min = -25
r_max = 5
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C12
g_band_b = C13
g_min = -30
g_max = 25
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C08
b_min = -83.15
b_max = -30.15
b_gamma = 1.0
b_invert = True

