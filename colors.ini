# ------------------------------------------------------------------------------
# CANAL 13: INFRAVERMELHO ONDAS LONGAS / JANELA LIMPA (10.3 µm)
# ------------------------------------------------------------------------------
# Menos sensível ao vapor d'água. Principal canal para topos convectivos.
# - Superfície e nuvens rasas (+40°C a -10°C): escala de cinza.
# - Topos frios (-20°C a -90°C): ciano, azul, verde, amarelo, vermelho, preto,
#   branco e rosa. Abaixo de -60°C o contraste é bem forte, pra destacar os
#   topos de cumulonimbus mais severos.
[PALETTE_BAND_13]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

