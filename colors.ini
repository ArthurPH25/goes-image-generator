# ==============================================================================
# CONFIGURAÇÃO DE PALETAS DE CORES UNIVERSAIS (GOES-16 / GOES-19)
# ==============================================================================
# Regras gerais:
# 1. Cada banda térmica do instrumento ABI tem sua própria seção no formato
#    [PALETTE_BAND_XX].
# 2. As chaves são os valores físicos medidos pelo satélite (ex: Temperatura
#    de Brilho em °C). O script faz uma interpolação linear suave entre as cores.
# 3. Formato obrigatório: Valor_Fisico_Inteiro = #CodigoHexadecimal
# 4. As chaves devem ser números inteiros (ex: -63). Não inventa moda de usar
#    casa decimal, senão vai causar erro fatal de conversão e o script falha.
# 5. Independência: o script lê cada seção de forma isolada. As bandas 11 a 16
#    usam a mesma paleta aqui embaixo apenas por padrão visual. Você pode
#    alterar as cores do Canal 13 à vontade sem medo de quebrar as outras.

# ------------------------------------------------------------------------------
# CANAL 07: INFRAVERMELHO ONDAS CURTAS / JANELA TÉRMICA E FOGO (3.9 µm)
# ------------------------------------------------------------------------------
# Sensível a focos de calor/incêndios, nevoeiro noturno e superfície.
# - Fogo/Superfície (+50°C a +100°C): Destacados em vermelho, magenta e branco
# - Nuvens Frias (-80°C a -10°C): Tons frios (ciano, azul e roxo).
[PALETTE_BAND_07]
100 = #FFFFFF
80 = #FF00FF
60 = #FF0000
40 = #1A1A1A
20 = #444444
0 = #888888
-20 = #CCCCCC
-40 = #00FFFF
-60 = #0000FF
-80 = #FFFFFF

# ------------------------------------------------------------------------------
# CANAL 08: VAPOR D'ÁGUA TROPOSFERA SUPERIOR (6.2 µm)
# ------------------------------------------------------------------------------
# Mede a umidade integrada na camada superior da troposfera.
# - Camada Seca/Quente (-20°C a +10°C): Ar seco e subsidência em tons quentes.
# - Camada Úmida/Fria (-70°C a -30°C): Umidade e topos altos em tons frios.
[PALETTE_BAND_08]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ------------------------------------------------------------------------------
# CANAL 09: VAPOR D'ÁGUA TROPOSFERA MÉDIA (6.9 µm)
# ------------------------------------------------------------------------------
# Mede a umidade integrada na camada média da troposfera.
# - Mantém o gradiente térmico do Canal 08 para rastrear transporte de umidade.
[PALETTE_BAND_09]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ------------------------------------------------------------------------------
# CANAL 10: VAPOR D'ÁGUA TROPOSFERA BAIXA (7.3 µm)
# ------------------------------------------------------------------------------
# Mede a umidade nos níveis baixos da troposfera (sem tocar a superfície).
# - Útil para identificar frentes e ondas curtas nos mesmos limiares visuais.
[PALETTE_BAND_10]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ------------------------------------------------------------------------------
# CANAL 11: INFRAVERMELHO FASE DO TOPO DA NUVEM (8.4 µm)
# ------------------------------------------------------------------------------
# Diferencia nuvens de água líquida das nuvens de gelo e rastreia poeira.
# - Temperaturas Frias (-30°C a -90°C): Topos congelados destacados.
[PALETTE_BAND_11]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ------------------------------------------------------------------------------
# CANAL 12: INFRAVERMELHO BANDA DE OZÔNIO (9.6 µm)
# ------------------------------------------------------------------------------
# Analisa a dinâmica da tropopausa e concentração de ozônio.
# - Acompanha a paleta de infravermelho padrão para avaliação de tempestades.
[PALETTE_BAND_12]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ------------------------------------------------------------------------------
# CANAL 13: INFRAVERMELHO ONDAS LONGAS / JANELA LIMPA (10.3 µm)
# ------------------------------------------------------------------------------
# Menos sensível ao vapor d'água. Principal canal para topos convectivos.
# - Superfície e Nuvens Rasas (+40°C a 0°C): Tons de cinza.
# - Severidade / Cumulonimbus (-60°C a -90°C): Contraste extremo (rosa/branco).
[PALETTE_BAND_13]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ------------------------------------------------------------------------------
# CANAL 14: INFRAVERMELHO JANELA LONGA (11.2 µm)
# ------------------------------------------------------------------------------
# Excelente para temperatura da superfície do mar (SST) e cinzas vulcânicas.
# - Utiliza o padrão térmico universal para rápida identificação de topos frios.
[PALETTE_BAND_14]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ------------------------------------------------------------------------------
# CANAL 15: INFRAVERMELHO JANELA SUJA (12.3 µm)
# ------------------------------------------------------------------------------
# Mais sensível à umidade em baixos níveis e poeira em suspensão.
# - Trabalha em conjunto com as outras janelas mantendo a matriz de cores.
[PALETTE_BAND_15]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ------------------------------------------------------------------------------
# CANAL 16: INFRAVERMELHO BANDA DE CO2 (13.3 µm)
# ------------------------------------------------------------------------------
# Usado para estimar a altura do topo das nuvens e propriedades da tropopausa.
# - Segue a gradação térmica severa padrão para nuvens de desenvolvimento vertical.
[PALETTE_BAND_16]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ------------------------------------------------------------------------------
# CANAL GLM: MAPEADOR GEOESTACIONÁRIO DE RAIOS
# ------------------------------------------------------------------------------
# Configuração de cores baseada na idade do raio (em segundos).
#
# - "default": usado quando glm_flash_age = False no config.ini (todos os
#   raios saem com essa exata cor, ignorando o resto).
# - Chaves numéricas: usadas quando glm_flash_age = True. O valor é a idade
#   do raio em segundos.
# - Interpolação: O script arredonda pra chave inferior mais próxima (ex: um
#   raio que caiu há 200s vai usar a cor definida na chave 150).
[PALETTE_GLM]
default = #FFFF00
0 = #FFFFFF
150 = #FFFF00
300 = #FFA500
450 = #FF0000