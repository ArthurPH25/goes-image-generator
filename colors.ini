# ==============================================================================
# COLOR PALETTE AND RGB RECIPE CONFIGURATION (GOES-16 / GOES-19)
# ==============================================================================
# This file has two kinds of sections, one for each product family:
#
# 1. [PALETTE_<PRODUCT>]: continuous LUT (physical value -> color), used by
#    the single-channel products: thermal bands (C07-C16), SPLIT_WINDOW, the
#    three cloud products and GLM in DENSITY mode. GLM in POINTS mode is the
#    exception: its colors are stepped, with no interpolation (rules in its
#    own section).
#    Rules for this family (the same for every section of this kind):
#    a. Keys are integer physical values (°C, meters or number of flashes,
#       depending on the section). The script interpolates linearly between
#       all the colors.
#    b. Required format: Integer_Physical_Value = Color. Hex code
#       (#RRGGBB, recommended) or a matplotlib color name.
#    c. Keys must be integers. No decimal places, otherwise there is a fatal
#       conversion error. Beyond that it is free: you choose as many keys as
#       you like and the spacing may be irregular.
#    d. Each section needs at least 2 different keys (linear interpolation
#       needs a minimum and a maximum). PALETTE_GLM always needs the
#       "default" key; if [GLM] flash_age = True, it also needs at least 1
#       numeric age key (see its own section below).
#    e. The lowest and highest key of each section define the limits of the
#       scale: measured values outside that range get the color of the
#       corresponding end. These limits also define the side colorbar. In
#       GLM/DENSITY the bar shows flashes per cell.
#
# 2. [RGB_<PRODUCT>]: recipe for a 3-band Red/Green/Blue composite, used by
#    the multispectral composites and by GEOCOLOR. Each color channel
#    (r_/g_/b_) has: source band (band, "C" + 2 digits), physical range
#    (min/max: °C for thermal bands, % reflectance 0-100 for visible/NIR
#    bands), gamma (gamma, 1.0 = linear) and whether the scale is inverted
#    (invert = True/False). The script normalizes each band to the min-max
#    range, applies gamma and builds the RGB image. Gamma convention (the
#    same as the EUMETSAT/CIRA guides): output = normalized_value ^ (1 /
#    gamma). Gamma below 1 darkens and emphasizes the bright tones (e.g. 0.4
#    on the red of FIRE_TEMPERATURE); gamma above 1 brightens. GEOCOLOR has a
#    similar format, but with a synthetic green channel (see its own
#    section).
#
# Comments only work on their own lines, starting with #. A comment on the
# same line as a value becomes part of the value and causes an error. Save as
# UTF-8.
#
# GENERAL NOTE ON THE REFERENCE VALUES (RGB and cloud products):
# The min/max/gamma values of the [RGB_*] sections below follow the most
# widely cited public quick guides from EUMETSAT/CIMSS/CIRA for each
# composite (exception: OVERSHOOTING_TOPS, see the warning in its section).
# Different guides (and different versions of the same guide) sometimes use
# slightly different ranges. If the final color does not match a reference
# image you trust, adjust the numbers here, with no need to touch the code.
# The [PALETTE_CLOUD_BASE_HEIGHT] and [PALETTE_CLOUD_THICKNESS] sections
# carry a separate, more serious warning: read it before using those two
# products operationally.

# ==============================================================================
