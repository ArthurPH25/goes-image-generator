# ==============================================================================
# SPLIT WINDOW DIFFERENCE (C13 - C15, em °C)
# ==============================================================================
# Valores próximos de zero ou negativos indicam topos de nuvem de gelo opacos
# e espessos (inclusive overshooting tops); valores mais positivos indicam céu
# claro, nuvens baixas/quentes ou cirros finos semitransparentes. É uma
# convenção comum entre serviços operacionais, não um padrão único e oficial.
# Ajuste as chaves à vontade se preferir outra faixa de realce.
[PALETTE_SPLIT_WINDOW]
10 = #08306B
5 = #4292C6
2 = #C6DBEF
0 = #F7F7F7
-2 = #FDD0A2
-5 = #FD8D3C
-8 = #E31A1C
-10 = #67000D

# ==============================================================================
# GLM, MODO POINTS (idade dos raios, em segundos)
# ==============================================================================
# - "default": usado quando [GLM] flash_age = False (todos os raios saem com
#   essa cor, ignorando o resto).
#
# - Chaves numéricas: usadas quando flash_age = True. O valor é a idade do
#   raio em segundos. Sem interpolação (é por degraus): o script usa a maior
#   chave que seja menor ou igual à idade do raio (ex: raio de 200s usa a cor
#   da chave 150). Idades acima da maior chave usam a cor da maior chave, e
#   abaixo da menor usam a cor da menor.
#
# - Só valem "default" e idades inteiras. Qualquer outra chave dá erro na
#   validação inicial.
#
# - A legenda do mapa é montada a partir dessas chaves, em minutos: a primeira
#   faixa sai como "≤ X min" (X = segunda chave), as do meio como "X–Y min" e
#   a última como "≥ X min". Chaves acima do tempo de histórico
#   (glm_history_lookback_steps x 20s) aparecem na legenda, mas nunca são usadas.
[PALETTE_GLM]
default = #FFFF00
0 = #FFFFFF
150 = #FFFF00
300 = #FFA500
450 = #FF0000

# ==============================================================================
# GLM, MODO DENSITY (nº de raios por célula da grade, no instante de 20s)
# ==============================================================================
# LUT contínua igual às bandas térmicas (mesmas regras a/b/c/d/e do topo do
# arquivo), mas a chave aqui é contagem de raios por célula, não temperatura.
# A célula é definida por [GLM] density_grid_resolution_km. A escala abaixo
# é só um ponto de partida: recorte menor (mais raios concentrados por
# célula) geralmente pede um teto mais alto que 25.
# A chave 0 usa #00000000 (formato #RRGGBBAA, totalmente transparente) para que
# células sem raios deixem o fundo visível. Com uma cor opaca nessa chave, a
# grade cobre o mapa inteiro.
[PALETTE_GLM_DENSITY]
0 = #00000000
1 = #2c115f
3 = #721f81
6 = #b73779
10 = #f1605d
15 = #feb078
25 = #fcfdbf

# ==============================================================================
# PRODUTOS DE NUVEM (ABI-L2-ACHAF / CODF / ACTPF)
# ==============================================================================
# CLOUD_TOP_HEIGHT lê a variável HT do produto oficial ABI-L2-ACHAF (Cloud Top
# Height) da NOAA. É dado publicado, não uma estimativa deste projeto.
#
# AVISO IMPORTANTE: CLOUD_BASE_HEIGHT e CLOUD_THICKNESS
# Não existe um produto público oficial de altura de base ou espessura
# geométrica de nuvem no bucket AWS da NOAA equivalente ao que o CIRA/SLIDER
# mostra na interface deles (aquele é gerado por um pipeline à parte, não
# distribuído como NetCDF baixável). Este projeto ESTIMA os dois combinando
# ACHAF (altura do topo) com uma parametrização simples de espessura em
# função da fase (ACTPF) e da profundidade óptica (CODF), no estilo do método
# de Minnis et al. (2008) usado como referência por vários produtos CIRA/NOAA.
# Trate CLOUD_BASE_HEIGHT e CLOUD_THICKNESS como estimativas experimentais
# pra visualização, não como produto operacional validado. Os coeficientes
# ficam em [ESTIMATE_CLOUD_GEOMETRY] logo abaixo das paletas, editáveis.
# À noite (sol abaixo de ~82° de zênite) a NOAA só considera confiável COD
# entre 1 e 8, então nuvens espessas têm espessura subestimada nesse horário.

# ------------------------------------------------------------------------------
# CLOUD_TOP_HEIGHT: ALTURA DO TOPO DA NUVEM (m)
# ------------------------------------------------------------------------------
[PALETTE_CLOUD_TOP_HEIGHT]
0 = #08306B
2000 = #2171B5
4000 = #6BAED6
6000 = #41AB5D
8000 = #ADDD8E
10000 = #FFFFB2
12000 = #FED976
14000 = #FD8D3C
16000 = #E31A1C
18000 = #FFFFFF

# ------------------------------------------------------------------------------
# CLOUD_BASE_HEIGHT: ALTURA DA BASE DA NUVEM (m, estimativa)
# ------------------------------------------------------------------------------
[PALETTE_CLOUD_BASE_HEIGHT]
0 = #3F007D
500 = #6A51A3
1000 = #807DBA
2000 = #9E9AC8
3000 = #BCBDDC
5000 = #DADAEB
7000 = #FCBBA1
9000 = #FB6A4A
12000 = #A50F15

# ------------------------------------------------------------------------------
# CLOUD_THICKNESS: ESPESSURA GEOMÉTRICA DA NUVEM (m, estimativa)
# ------------------------------------------------------------------------------
[PALETTE_CLOUD_THICKNESS]
0 = #FFFFE5
500 = #F7FCB9
1000 = #D9F0A3
2000 = #ADDD8E
3000 = #78C679
5000 = #41AB5D
7000 = #238443
9000 = #005A32

# ------------------------------------------------------------------------------
# ESTIMATE_CLOUD_GEOMETRY: COEFICIENTES DA ESTIMATIVA DE GEOMETRIA
# ------------------------------------------------------------------------------
# Coeficientes da estimativa de geometria de nuvem (ver aviso acima).
# - water_coeff / water_exponent: espessura_km = water_coeff * COD^water_exponent
#   para pixels com fase líquida (ACTPF Phase = água/água superesfriada).
#
# - ice_coeff / ice_exponent: mesma fórmula, para pixels com fase gelo/cirro.
#
# - min_thickness_m / max_thickness_m: trava de sanidade física (a fórmula
#   sozinha pode extrapolar mal em COD muito baixo ou muito alto).
#
# - base_height_floor_m: altura de base nunca sai negativa; abaixo disso vira
#   este valor (evita base "no chão" com ruído de COD).
[ESTIMATE_CLOUD_GEOMETRY]
water_coeff = 0.095
water_exponent = 0.42
ice_coeff = 0.65
ice_exponent = 0.20
min_thickness_m = 200
max_thickness_m = 10000
base_height_floor_m = 0

# ==============================================================================
# COMPOSIÇÕES RGB
# ==============================================================================
# Cada canal (r, g, b) tem as chaves <canal>_mode, <canal>_min, <canal>_max,
# <canal>_gamma e <canal>_invert (True/False), mais as bandas conforme o modo:
#   - <canal>_mode = single: usa uma banda só, em <canal>_band (C01-C16).
#   - <canal>_mode = difference: usa A - B, com as bandas em <canal>_band_a e
#     <canal>_band_b (C01-C16). min/max passam a ser a faixa dessa diferença.
# min/max em °C para bandas térmicas (C07-C16) e
# em % de refletância (0-100) para bandas visíveis/NIR (C01-C06). invert=True
# inverte a normalização (1 - x) depois da gama. Use para bandas onde "mais
# frio"/"mais escuro" deve aparecer mais brilhante no canal de cor.
#
# Bandas que cada produto baixa. A receita só pode usar bandas desta lista,
# qualquer outra dá erro na validação inicial:
#   AIRMASS: C08 C10 C12 C13 | DAY_CLOUD_PHASE: C02 C05 C13
#   NIGHT_MICROPHYSICS: C07 C13 C15 | SEVERE_STORMS: C02 C05 C07 C08 C10 C13
#   OVERSHOOTING_TOPS: C08 C12 C13 | FIRE_TEMPERATURE: C05 C06 C07
#   GEOCOLOR: C01 C02 C03 C13
# Para usar outra banda, acrescente-a nas fontes do produto em
# products/registry.py (função build_registry).

# ------------------------------------------------------------------------------
# AIRMASS RGB (EUMETSAT): massas de ar, tropopausa dinâmica, vórtices
# ------------------------------------------------------------------------------
# R = WV6.2(C08) - WV7.3(C10) | G = O3(C12) - IRW(C13) | B = WV6.2(C08) invertido
# No guia NOAA/CIRA o azul vai de -29.25 °C (0) a -64.65 °C (1), ou seja, mais
# frio = mais azul. Como min tem que ser menor que max, isso vira b_invert = True.
[RGB_AIRMASS]
r_mode = difference
r_band_a = C08
r_band_b = C10
r_min = -26.2
r_max = 0.6
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C12
g_band_b = C13
g_min = -43.2
g_max = 6.7
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C08
b_min = -64.65
b_max = -29.25
b_gamma = 1.0
b_invert = True

# ------------------------------------------------------------------------------
# DAY CLOUD PHASE DISTINCTION RGB (CIRA/NOAA, baseada na JMA): fase de nuvem diurna
# ------------------------------------------------------------------------------
# R = IRW(C13) invertido | G = VIS(C02) | B = NIR neve/gelo(C05)
# No guia o vermelho vai de 7.5 °C (0) a -53.5 °C (1): mais frio = mais vermelho.
# Como min tem que ser menor que max, isso vira r_invert = True.
[RGB_DAY_CLOUD_PHASE]
r_mode = single
r_band = C13
r_min = -53.5
r_max = 7.5
r_gamma = 1.0
r_invert = True
g_mode = single
g_band = C02
g_min = 0
g_max = 78
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C05
b_min = 1
b_max = 59
b_gamma = 1.0
b_invert = False

