# ==============================================================================
# SPLIT WINDOW DIFFERENCE (C13 - C15, in °C)
# ==============================================================================
# Values near zero or negative indicate opaque, thick ice cloud tops
# (including overshooting tops); more positive values indicate clear sky,
# low/warm clouds or thin semitransparent cirrus. This is a common
# convention among operational services, not a single official standard.
# Feel free to adjust the keys if you prefer a different enhancement range.
[PALETTE_SPLIT_WINDOW]
10 = #08306B
5 = #4292C6
2 = #C6DBEF
0 = #F7F7F7
-2 = #FDD0A2
-5 = #FD8D3C
-8 = #E31A1C
-10 = #67000D

# ==============================================================================
# GLM, POINTS MODE (flash age, in seconds)
# ==============================================================================
# - "default": used when [GLM] flash_age = False (all flashes are drawn in
#   this color, ignoring the rest).
#
# - Numeric keys: used when flash_age = True. The value is the flash age in
#   seconds. No interpolation (it is stepped): the script uses the largest
#   key that is less than or equal to the flash age (e.g. a 200 s flash uses
#   the color of key 150). Ages above the largest key use the color of the
#   largest key, and ages below the smallest use the color of the smallest.
#
# - Only "default" and integer ages are valid. Any other key causes an error
#   in the initial validation.
#
# - The map legend is built from these keys, in minutes: the first range
#   appears as "≤ X min" (X = second key), the middle ones as "X–Y min" and
#   the last as "≥ X min". Keys above the history length
#   (glm_history_lookback_steps x 20 s) appear in the legend but are never
#   used.
[PALETTE_GLM]
default = #FFFF00
0 = #FFFFFF
150 = #FFFF00
300 = #FFA500
450 = #FF0000

# ==============================================================================
# GLM, DENSITY MODE (number of flashes per grid cell, at the 20 s instant)
# ==============================================================================
# Continuous LUT, same as the thermal bands (same rules a/b/c/d/e from the
# top of the file), but here the key is flash count per cell, not
# temperature. The cell is defined by [GLM] density_grid_resolution_km. The
# scale below is only a starting point: a smaller crop (more flashes
# concentrated per cell) usually calls for a higher ceiling than 25.
# Key 0 uses #00000000 (#RRGGBBAA format, fully transparent) so that cells
# without flashes let the background show through. With an opaque color on
# that key, the grid covers the whole map.
[PALETTE_GLM_DENSITY]
0 = #00000000
1 = #2c115f
3 = #721f81
6 = #b73779
10 = #f1605d
15 = #feb078
25 = #fcfdbf

# ==============================================================================
# CLOUD PRODUCTS (ABI-L2-ACHAF / CODF / ACTPF)
# ==============================================================================
# CLOUD_TOP_HEIGHT reads the HT variable of NOAA's official ABI-L2-ACHAF
# (Cloud Top Height) product. It is published data, not an estimate made by
# this project.
#
# IMPORTANT WARNING: CLOUD_BASE_HEIGHT and CLOUD_THICKNESS
# There is no official public cloud base height or geometric thickness
# product in NOAA's AWS bucket equivalent to what CIRA/SLIDER shows in its
# interface (that one is generated by a separate pipeline, not distributed
# as downloadable NetCDF). This project ESTIMATES both by combining ACHAF
# (top height) with a simple thickness parameterization as a function of
# phase (ACTPF) and optical depth (CODF), in the style of the Minnis et al.
# (2008) method used as a reference by several CIRA/NOAA products. Treat
# CLOUD_BASE_HEIGHT and CLOUD_THICKNESS as experimental estimates for
# visualization, not as a validated operational product. The coefficients
# are in [ESTIMATE_CLOUD_GEOMETRY] right below the palettes, and are
# editable.
# At night (sun below ~82° zenith angle) NOAA only considers COD reliable
# between 1 and 8, so thick clouds have their thickness underestimated at
# that time.

# ------------------------------------------------------------------------------
# CLOUD_TOP_HEIGHT: CLOUD TOP HEIGHT (m)
# ------------------------------------------------------------------------------
[PALETTE_CLOUD_TOP_HEIGHT]
0 = #08306B
2000 = #2171B5
4000 = #6BAED6
6000 = #41AB5D
8000 = #ADDD8E
10000 = #FFFFB2
12000 = #FED976
14000 = #FD8D3C
16000 = #E31A1C
18000 = #FFFFFF

# ------------------------------------------------------------------------------
# CLOUD_BASE_HEIGHT: CLOUD BASE HEIGHT (m, estimate)
# ------------------------------------------------------------------------------
[PALETTE_CLOUD_BASE_HEIGHT]
0 = #3F007D
500 = #6A51A3
1000 = #807DBA
2000 = #9E9AC8
3000 = #BCBDDC
5000 = #DADAEB
7000 = #FCBBA1
9000 = #FB6A4A
12000 = #A50F15

# ------------------------------------------------------------------------------
# CLOUD_THICKNESS: CLOUD GEOMETRIC THICKNESS (m, estimate)
# ------------------------------------------------------------------------------
[PALETTE_CLOUD_THICKNESS]
0 = #FFFFE5
500 = #F7FCB9
1000 = #D9F0A3
2000 = #ADDD8E
3000 = #78C679
5000 = #41AB5D
7000 = #238443
9000 = #005A32

# ------------------------------------------------------------------------------
# ESTIMATE_CLOUD_GEOMETRY: GEOMETRY ESTIMATE COEFFICIENTS
# ------------------------------------------------------------------------------
# Coefficients of the cloud geometry estimate (see the warning above).
# - water_coeff / water_exponent: thickness_km = water_coeff * COD^water_exponent
#   for liquid-phase pixels (ACTPF Phase = water/supercooled water).
#
# - ice_coeff / ice_exponent: same formula, for ice/cirrus-phase pixels.
#
# - min_thickness_m / max_thickness_m: physical sanity clamp (the formula
#   alone can extrapolate badly at very low or very high COD).
#
# - base_height_floor_m: base height never goes negative; below this it
#   becomes this value (avoids a "ground-level" base from COD noise).
[ESTIMATE_CLOUD_GEOMETRY]
water_coeff = 0.095
water_exponent = 0.42
ice_coeff = 0.65
ice_exponent = 0.20
min_thickness_m = 200
max_thickness_m = 10000
base_height_floor_m = 0

# ==============================================================================
# RGB COMPOSITES
# ==============================================================================
# Each channel (r, g, b) has the keys <channel>_mode, <channel>_min,
# <channel>_max, <channel>_gamma and <channel>_invert (True/False), plus the
# bands according to the mode:
#   - <channel>_mode = single: uses a single band, in <channel>_band
#     (C01-C16).
#   - <channel>_mode = difference: uses A - B, with the bands in
#     <channel>_band_a and <channel>_band_b (C01-C16). min/max become the
#     range of that difference.
# min/max are in °C for thermal bands (C07-C16) and in % reflectance (0-100)
# for visible/NIR bands (C01-C06). invert=True inverts the normalization
# (1 - x) before gamma, so gamma acts on the already inverted value, as in
# the guides that give the range backwards. Use it for bands where
# "colder"/"darker" should appear brighter in the color channel.
#
# Bands each product downloads. The recipe may only use bands from this
# list, anything else causes an error in the initial validation:
#   AIRMASS: C08 C10 C12 C13 | DAY_CLOUD_PHASE: C02 C05 C13
#   NIGHT_MICROPHYSICS: C07 C13 C15 | SEVERE_STORMS: C02 C05 C07 C08 C10 C13
#   OVERSHOOTING_TOPS: C08 C12 C13 | FIRE_TEMPERATURE: C05 C06 C07
#   GEOCOLOR: C01 C02 C03 C13
# To use another band, add it to the product sources in
# products/registry.py (build_registry function).

# ------------------------------------------------------------------------------
# AIRMASS RGB (EUMETSAT): air masses, dynamic tropopause, vortices
# ------------------------------------------------------------------------------
# R = WV6.2(C08) - WV7.3(C10) | G = O3(C12) - IRW(C13) | B = WV6.2(C08) inverted
# In the NOAA/CIRA guide the blue goes from -29.25 °C (0) to -64.65 °C (1),
# i.e. colder = bluer. Since min must be less than max, this becomes
# b_invert = True.
[RGB_AIRMASS]
r_mode = difference
r_band_a = C08
r_band_b = C10
r_min = -26.2
r_max = 0.6
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C12
g_band_b = C13
g_min = -43.2
g_max = 6.7
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C08
b_min = -64.65
b_max = -29.25
b_gamma = 1.0
b_invert = True

# ------------------------------------------------------------------------------
# DAY CLOUD PHASE DISTINCTION RGB (CIRA/NOAA, based on JMA): daytime cloud phase
# ------------------------------------------------------------------------------
# R = IRW(C13) inverted | G = VIS(C02) | B = NIR snow/ice(C05)
# In the guide the red goes from 7.5 °C (0) to -53.5 °C (1): colder = redder.
# Since min must be less than max, this becomes r_invert = True.
[RGB_DAY_CLOUD_PHASE]
r_mode = single
r_band = C13
r_min = -53.5
r_max = 7.5
r_gamma = 1.0
r_invert = True
g_mode = single
g_band = C02
g_min = 0
g_max = 78
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C05
b_min = 1
b_max = 59
b_gamma = 1.0
b_invert = False

# ------------------------------------------------------------------------------
# NIGHT MICROPHYSICS RGB (NOAA/CIRA, ABI version): fog/low cloud and phase at night
# ------------------------------------------------------------------------------
# R = IRW-Dirty(C15) - IRW-Clean(C13) | G = IRW(C13) - IR3.9(C07) | B = IRW(C13)
[RGB_NIGHT_MICROPHYSICS]
r_mode = difference
r_band_a = C15
r_band_b = C13
r_min = -6.7
r_max = 2.6
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C13
g_band_b = C07
g_min = -3.1
g_max = 5.2
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C13
b_min = -29.6
b_max = 19.5
b_gamma = 1.0
b_invert = False

# ------------------------------------------------------------------------------
# SEVERE STORMS RGB (Day Convection): only makes sense in daytime (uses visible and 3.9 µm channels)
# ------------------------------------------------------------------------------
# R = WV6.2(C08) - WV7.3(C10) | G = IR3.9(C07) - IRW(C13) | B = NIR1.6(C05) - VIS0.6(C02)
# Ranges from the Day Convection RGB of the NOAA/CIRA guide, JMA and SEVIRI
# (mid-latitude version). EUMETSAT has a more recent variant for the FCI,
# with narrower ranges (R -30 to 0, G 0 to 55, B -70 to 20). In the tropics
# EUMETSAT suggests G from -5 to 75 with gamma 0.33, because the original
# leaves too many tops yellow. The NOAA guide lists gamma 1 on green;
# EUMETSAT and JMA use 0.5. Bands C05 and C02 in %.
[RGB_SEVERE_STORMS]
r_mode = difference
r_band_a = C08
r_band_b = C10
r_min = -35
r_max = 5
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C07
g_band_b = C13
g_min = -5
g_max = 60
g_gamma = 0.5
g_invert = False
b_mode = difference
b_band_a = C05
b_band_b = C02
b_min = -75
b_max = 25
b_gamma = 1.0
b_invert = False

# ------------------------------------------------------------------------------
# OVERSHOOTING TOPS RGB (experimental recipe): tops that penetrate the tropopause
# ------------------------------------------------------------------------------
# R = WV6.2(C08) - IRW(C13) | G = O3(C12) - IRW(C13) | B = WV6.2(C08) inverted
# This is not a recipe published by EUMETSAT, NOAA or CIRA. It was inspired
# by the Airmass and the Tropical Airmass (EUMETSAT's adjustment for cold
# tops, which widens the green to -25 to +25 K on SEVIRI), but swaps the red
# pair (C08 - C13, instead of C08 - C10) and uses its own ranges: green from
# -30 to 25 and blue from -30.15 °C to -83.15 °C (243 K to 190 K), with the
# coldest being bluest. Since min must be less than max, the blue becomes
# b_invert = True. Overshooting tops appear in light/white tones. Treat it
# as an experimental visualization and check it against a reference image
# before drawing conclusions. If you want a recipe with a published source,
# use AIRMASS.
[RGB_OVERSHOOTING_TOPS]
r_mode = difference
r_band_a = C08
r_band_b = C13
r_min = -25
r_max = 5
r_gamma = 1.0
r_invert = False
g_mode = difference
g_band_a = C12
g_band_b = C13
g_min = -30
g_max = 25
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C08
b_min = -83.15
b_max = -30.15
b_gamma = 1.0
b_invert = True

# ------------------------------------------------------------------------------
# FIRE TEMPERATURE RGB (CIRA): hot spots/fires
# ------------------------------------------------------------------------------
# R = IR3.9(C07) | G = Particle size(C06) | B = NIR snow/ice(C05)
[RGB_FIRE_TEMPERATURE]
r_mode = single
r_band = C07
r_min = 0
r_max = 60
r_gamma = 0.4
r_invert = False
g_mode = single
g_band = C06
g_min = 0
g_max = 100
g_gamma = 1.0
g_invert = False
b_mode = single
b_band = C05
b_min = 0
b_max = 75
b_gamma = 1.0
b_invert = False

# ==============================================================================
# GEOCOLOR (CIRA-like approximation)
# ==============================================================================
# CIRA's official GeoColor additionally blends a static night lights mosaic
# and manually calibrated snow/ice enhancements. This version is an
# approximation: synthetic true-color by day, enhanced IR at night, with a
# smooth transition between the two based on each pixel's solar zenith
# angle.
# - day_r/day_b: bands used in the red and blue channels of the true-color.
#
# - green_synth_weights: synthetic green combination (GOES has no real green
#   band) from VIS(C02), Vegetation(C03) and Blue(C01):
#   green = w_r*C02 + w_veggie*C03 + w_b*C01 (fractions summing to ~1.0).
#
# - night_band: band used as the base of the night image (IR grayscale).
#
# - night_min/night_max: temperature range (°C) of the night gray. Cold
#   becomes brighter. night_gamma follows the same convention as the gamma of
#   the RGB recipes.
#
# - twilight_zenith_start/end: solar zenith angle (degrees) where the
#   day->night transition starts and ends (in between, a proportional mix).
[RGB_GEOCOLOR]
day_r_band = C02
day_r_min = 0
day_r_max = 100
day_b_band = C01
day_b_min = 0
day_b_max = 100
green_synth_weights = 0.45, 0.10, 0.45
night_band = C13
night_min = -70
night_max = 40
night_gamma = 0.9
twilight_zenith_start = 80
twilight_zenith_end = 92