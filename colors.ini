# ------------------------------------------------------------------------------
# CANAL GLM: MAPEADOR GEOESTACIONÁRIO DE RAIOS
# ------------------------------------------------------------------------------
# Configuração de cores baseada na idade do raio (em segundos).
#
# - "default": usado quando glm_flash_age = False no config.ini (todos os
#   raios saem com essa exata cor, ignorando o resto).
# - Chaves numéricas: usadas quando glm_flash_age = True. O valor é a idade
#   do raio em segundos.
# - Sem interpolação (é por degraus): o script usa a maior chave que seja menor
#   ou igual à idade do raio (ex: um raio de 200s usa a cor definida na chave
#   150). Idades acima da maior chave usam a cor da maior chave, e idades
#   abaixo da menor chave usam a cor da menor.
# - Só valem "default" e idades inteiras. Qualquer outra chave (ex: 1.5, -30,
#   abc) dá erro na validação inicial.
# - A legenda do mapa é montada a partir dessas chaves. Chaves acima do tempo de
#   histórico (glm_history_lookback_steps x 20s) aparecem na legenda, mas nunca
#   são usadas.
[PALETTE_GLM]
default = #FFFF00
0 = #FFFFFF
150 = #FFFF00
300 = #FFA500
450 = #FF0000