# ==============================================================================
# CONFIGURAÇÃO DE PALETAS DE CORES UNIVERSAIS (GOES-16 / GOES-19)
# ==============================================================================
# DIRETRIZES DE FUNCIONAMENTO E FORMATAÇÃO:
# 1. Cada banda térmica do instrumento ABI possui sua própria seção de paleta no
#    formato [PALETTE_BAND_XX], onde XX é o número do canal com 2 dígitos.
# 2. As chaves (lado esquerdo) representam os valores físicos medidos pelo
#    satélite (ex: Temperatura de Brilho em °C ou índices de refletância).
# 3. O script realiza uma interpolação linear suave entre as cores definidas.
# 4. Formato obrigatório: Valor_Fisico_Inteiro = #CodigoHexadecimal
# 5. As chaves DEVEM ser números inteiros (ex: -60). O uso de casas decimais
#    causará erro fatal de conversão no script.
# 6. IMPORTANTE: cada seção [PALETTE_BAND_XX] é lida de forma totalmente
#    independente das outras. As bandas 11 a 16 abaixo usam a mesma paleta
#    de valores/cores entre si apenas por CONVENÇÃO deste arquivo (padrão
#    visual comum para janelas de infravermelho), não porque o script
#    exige isso. Você pode editar a paleta de uma banda térmica individual
#    (ex: só o Canal 13) sem precisar replicar a mudança nas demais.
# ==============================================================================

# ==============================================================================
# CANAL 07: INFRAVERMELHO ONDAS CURTAS / JANELA TÉRMICA E FOGO (3.9 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Banda sensível a focos de calor/incêndios, nevoeiro noturno e superfície.
# - Fogo/Superfície Quente (+50°C a +100°C): Destacados em vermelho/magenta.
# - Nuvens Frias e Convecção (-80°C a -10°C): Tons frios (ciano, azul e roxo).
# ==============================================================================
[PALETTE_BAND_07]
100 = #FFFFFF
80 = #FF00FF
60 = #FF0000
40 = #1A1A1A
20 = #444444
0 = #888888
-20 = #CCCCCC
-40 = #00FFFF
-60 = #0000FF
-80 = #FFFFFF

# ==============================================================================
# CANAL 08: VAPOR D'ÁGUA TROPOSFERA SUPERIOR (6.2 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Mede a umidade integrada na camada superior da troposfera.
# - Camada Seca/Quente (-20°C a +10°C): Ar seco e subsidência em tons quentes.
# - Camada Úmida/Fria (-70°C a -30°C): Umidade e topos altos em tons frios.
# ==============================================================================
[PALETTE_BAND_08]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ==============================================================================
# CANAL 09: VAPOR D'ÁGUA TROPOSFERA MÉDIA (6.9 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Mede a umidade integrada na camada média da troposfera.
# - Mantém o gradiente térmico do Canal 08 para rastrear transporte de umidade.
# ==============================================================================
[PALETTE_BAND_09]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ==============================================================================
# CANAL 10: VAPOR D'ÁGUA TROPOSFERA BAIXA (7.3 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Mede a umidade nos níveis baixos da troposfera (sem tocar a superfície).
# - Útil para identificar frentes e ondas curtas nos mesmos limiares visuais.
# ==============================================================================
[PALETTE_BAND_10]
10 = #400000
0 = #800000
-10 = #CC0000
-20 = #FF6600
-30 = #FFFF00
-40 = #00CC00
-50 = #00FFFF
-60 = #0000FF
-70 = #4B0082

# ==============================================================================
# CANAL 11: INFRAVERMELHO FASE DO TOPO DA NUVEM (8.4 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Diferencia nuvens de água líquida das nuvens de gelo e rastreia poeira.
# - Temperaturas Frias (-30°C a -90°C): Topos congelados destacados
# em contraste.
# ==============================================================================
[PALETTE_BAND_11]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ==============================================================================
# CANAL 12: INFRAVERMELHO BANDA DE OZÔNIO (9.6 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Analisa a dinâmica da tropopausa e concentração de ozônio.
# - Acompanha a paleta de infravermelho padrão para avaliação de tempestades.
# ==============================================================================
[PALETTE_BAND_12]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ==============================================================================
# CANAL 13: INFRAVERMELHO ONDAS LONGAS / JANELA LIMPA (10.3 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Menos sensível ao vapor d'água. Principal canal para topos convectivos.
# - Superfície e Nuvens Rasas (+40°C a 0°C): Tons de cinza.
# - Severidade / Cumulonimbus (-60°C a -90°C): Contraste extremo (rosa/branco).
# ==============================================================================
[PALETTE_BAND_13]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ==============================================================================
# CANAL 14: INFRAVERMELHO JANELA LONGA (11.2 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Excelente para temperatura da superfície do mar (SST) e cinzas vulcânicas.
# - Utiliza o padrão térmico universal para identificação rápida de topos frios.
# ==============================================================================
[PALETTE_BAND_14]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ==============================================================================
# CANAL 15: INFRAVERMELHO JANELA SUJA (12.3 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Mais sensível à umidade em baixos níveis e poeira em suspensão.
# - Trabalha em conjunto com as outras janelas mantendo a mesma matriz de cores.
# ==============================================================================
[PALETTE_BAND_15]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ==============================================================================
# CANAL 16: INFRAVERMELHO BANDA DE CO2 (13.3 µm)
# ==============================================================================
# REFERÊNCIA METEOROLÓGICA BÁSICA:
# - Usado para estimar a altura do topo das nuvens e propriedades da tropopausa.
# - Segue a gradação térmica severa padrão para nuvens de desenvolvimento 
# vertical.
# ==============================================================================
[PALETTE_BAND_16]
40 = #000000
30 = #1a1a1a
20 = #333333
10 = #555555
0 = #777777
-10 = #AAAAAA
-20 = #74F0F7
-30 = #00137D
-40 = #00FF00
-50 = #FFFF00
-60 = #FF0000
-70 = #000000
-80 = #FFFFFF
-90 = #ff84d2

# ==============================================================================
# CANAL GLM: MAPEADOR GEOESTACIONÁRIO DE RAIOS
# ==============================================================================
# REFERÊNCIA:
# - "default" é usado quando glm_flash_age = False no config.ini (todos os
#   raios com a mesma cor, sem legenda de faixas de tempo).
# - Chaves numéricas = idade do raio em SEGUNDOS, usadas quando
#   glm_flash_age = True no config.ini.
# - O script vai aplicar a cor baseado na chave inferior mais próxima (ex:
#   um raio com 200s de idade usa a cor da chave 150).
# ==============================================================================
[PALETTE_GLM]
default = #FFFF00
0 = #FFFFFF
150 = #FFFF00
300 = #FFA500
450 = #FF0000