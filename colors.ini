# ==============================================================================
# GEOCOLOR (aproximação CIRA-like)
# ==============================================================================
# O GeoColor oficial do CIRA mistura, além disso, um mosaico estático de luzes
# noturnas e realces específicos de neve/gelo calibrados manualmente. Esta
# versão é uma aproximação: true-color sintético de dia, IR realçado à noite,
# com transição suave entre os dois pelo ângulo zenital solar de cada pixel.
# - day_r/day_b: bandas usadas nos canais vermelho e azul do true-color.
#
# - green_synth_weights: combinação sintética de verde (GOES não tem banda
#   verde de verdade) a partir de VIS(C02), Vegetação(C03) e Azul(C01):
#   verde = w_r*C02 + w_veggie*C03 + w_b*C01 (frações somando ~1.0).
#
# - night_band: banda usada como base da imagem noturna (tons de cinza IR).
#
# - night_min/night_max: faixa de temperatura (°C) do cinza noturno. Frio fica
#   mais claro. night_gamma segue a mesma convenção da gama das receitas RGB.
#
# - twilight_zenith_start/end: ângulo zenital solar (graus) onde começa e
#   termina a transição dia->noite (entre os dois, mistura proporcional).
[RGB_GEOCOLOR]
day_r_band = C02
day_r_min = 0
day_r_max = 100
day_b_band = C01
