# ==============================================================================
# CONFIGURAÇÃO DAS PALETAS DE CORES E RECEITAS RGB (GOES-16 / GOES-19)
# ==============================================================================
# Este arquivo tem dois tipos de seção, um pra cada família de produto:
#
# 1. [PALETTE_<PRODUTO>]: LUT contínua (valor físico -> cor), usada pelos
#    produtos de canal único: bandas térmicas (C07-C16), SPLIT_WINDOW, os três
#    produtos de nuvem e o GLM em modo DENSITY. O GLM em modo POINTS é a
#    exceção: as cores são por degrau, sem interpolação (regras na seção dele).
#    Regras dessa família (iguais para todas as seções deste tipo):
#    a. As chaves são valores físicos inteiros (°C, metros ou nº de raios,
#       conforme a seção). O script interpola linearmente entre todas as cores.
#    b. Formato obrigatório: Valor_Fisico_Inteiro = Cor. Hexadecimal
#       (#RRGGBB, recomendado) ou nome de cor do matplotlib.
#    c. As chaves devem ser números inteiros. Não usa casa decimal, senão
#       erro fatal de conversão. Fora isso é livre: você escolhe quantas
#       chaves quiser e o espaçamento pode ser irregular.
#    d. Cada seção precisa de pelo menos 2 chaves diferentes (a interpolação
#       linear precisa de um mínimo e um máximo). PALETTE_GLM precisa sempre
#       da chave "default"; se [GLM] flash_age = True, precisa também de pelo
#       menos 1 chave numérica de idade (ver seção própria abaixo).
#    e. A menor e a maior chave de cada seção definem os limites da escala:
#       valores medidos fora desse intervalo saem com a cor da ponta
#       correspondente. Esses limites também definem a barra de cores
#       lateral. No GLM/DENSITY a barra mostra raios por célula.
#
# 2. [RGB_<PRODUTO>]: receita de composição de 3 bandas em Vermelho/Verde/
#    Azul, usada pelas composições multiespectrais e pelo GEOCOLOR. Cada canal
#    de cor (r_/g_/b_) tem: banda de origem (band, "C" + 2 dígitos), faixa
#    física (min/max: °C pra bandas térmicas, % de refletância 0-100 pra
#    bandas visíveis/NIR), gama (gamma, 1.0 = linear) e se inverte a escala
#    (invert = True/False). O script normaliza cada banda pro intervalo
#    min-max, aplica a gama e monta a imagem RGB. Convenção da gama (a mesma
#    dos guias EUMETSAT/CIRA): saída = valor_normalizado ^ (1 / gamma). Gama
#    menor que 1 escurece e realça os tons claros (ex: 0.4 no vermelho do
#    FIRE_TEMPERATURE); gama maior que 1 clareia. GEOCOLOR tem um formato
#    parecido, mas com um canal verde sintético (ver seção própria).
#
# Comentários só valem em linhas próprias, começando com #. Comentário na
# mesma linha do valor vira parte do valor e causa erro. Salve em UTF-8.
#
# AVISO GERAL SOBRE OS VALORES DE REFERÊNCIA (RGB e produtos de nuvem):
# Os min/max/gamma das seções [RGB_*] abaixo seguem os quick guides públicos
# mais citados da EUMETSAT/CIMSS/CIRA para cada composição (exceção: o
# OVERSHOOTING_TOPS, veja o aviso na seção dele). Guias diferentes
# (e versões diferentes do mesmo guia) às vezes usam faixas ligeiramente
# distintas. Se a cor final não bater com uma imagem de referência que você
# confia, ajuste os números aqui, sem precisar tocar no código. As seções
# [PALETTE_CLOUD_BASE_HEIGHT] e [PALETTE_CLOUD_THICKNESS] têm um aviso à
# parte, mais sério: leia antes de usar esses dois produtos operacionalmente.

