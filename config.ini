# ==============================================================================
# CONFIGURAÇÃO DO GERADOR DE IMAGENS DE SATÉLITE GOES-16 / GOES-19
# ==============================================================================
# Regras gerais:
# 1. Todas as chaves são obrigatórias. Não há valores padrão implícitos.
# 2. Chaves ausentes, incorretas ou com valores fora do formato esperado
#    interrompem a execução na validação inicial (antes de baixar qualquer coisa).
# 3. Comentários só valem em linhas próprias, começando com #. Comentário na
#    mesma linha do valor não funciona: vira parte do valor e causa erro.
# 4. Salve os arquivos .ini em UTF-8. Cada chave só pode aparecer uma vez por
#    seção.

# ------------------------------------------------------------------------------
# GERAL
# ------------------------------------------------------------------------------
# Configurações de canal e tipo de saída:
# - channel: banda espectral (1 a 16) ou GLM (Geostationary Lightning Mapper).
#   Canais 1 a 6 (refletância) saem sempre em tons de cinza: eles não usam
#   paleta do colors.ini. Só os canais 7 a 16 e o GLM têm cores editáveis.
# - generation_type: tipo de exportação (I = imagem única em PNG, V = vídeo).
[GENERAL]
channel = 9
generation_type = I

# ------------------------------------------------------------------------------
# TEMPO DA IMAGEM ÚNICA
# ------------------------------------------------------------------------------
# Parâmetros para generation_type = I (ignorados no modo vídeo).
#
# Formato das datas: sempre AAAA-MM-DD.
# Formato de image_time conforme a chave channel [GENERAL]:
# - ABI (1 a 16): HH:MM (sem segundos), minutos múltiplos de 10 (ex: 19:10).
# - GLM: HH:MM:SS (com segundos), segundos múltiplos de 20 (ex: 19:10:20).
# Trocar o canal exige revisar o formato do horário, senão o script falha.
#
# Só existem imagens ABI "Full Disk" (disco completo) a cada 10 minutos, no
# modo de escaneamento 6. Períodos mais antigos, de outro modo, não são achados.
#
# Se o instante não existir no bucket da NOAA (falha ou manutenção),
# o script encerra com erro fatal (diferente do modo vídeo, que pula
# o frame ausente e segue com os demais).
[IMAGE_TIME]
image_date = 2024-08-23
image_time = 19:30

# ------------------------------------------------------------------------------
# TEMPO DO VÍDEO
# ------------------------------------------------------------------------------
# Parâmetros de intervalo para generation_type = V.
#
# Formato das datas: sempre AAAA-MM-DD.
# Formato de start_time e end_time conforme a chave channel [GENERAL]:
# - ABI (1 a 16): HH:MM (sem segundos), avanço a cada 10 minutos.
# - GLM: HH:MM:SS (com segundos), avanço a cada 20 segundos.
# Os dois horários precisam obrigatoriamente estar no mesmo formato.
#
# fps: taxa de quadros do vídeo.
# Recomendado: 5-10 (análises/GLM) ou 15-30 (períodos longos).
[VIDEO_TIME]
start_date = 2023-11-03
start_time = 12:00
end_date = 2023-11-04
end_time = 00:00
fps = 10

# ------------------------------------------------------------------------------
# PROCESSAMENTO E RECURSOS
# ------------------------------------------------------------------------------
# num_workers: processos paralelos de renderização (CPU e RAM). Cada worker
#   baixa o próprio NetCDF principal, então num_workers também é o número de
#   downloads simultâneos do arquivo principal.
#   Dimensionamento recomendado:
#   - 8GB RAM: 2 a 4 workers | 16GB RAM: 6 a 8 | 32GB+ RAM: 12+.
#   Se o processo morrer sozinho no meio da execução, quase sempre é falta de
#   RAM: reduza num_workers (ou dpi / figure_width / figure_height).
#
# Fundo ABI para vídeos GLM: o fundo de cada bloco de 10 minutos é processado
# apenas uma vez e compartilhado em cache. Se tiver muitos workers disputando
# e o lock passar de 5min, o frame sai sem fundo com aviso no console. Se isso
# acontecer, abaixe o num_workers.
#
# Histórico do GLM (só quando o canal é GLM):
# - glm_history_lookback_steps: quantos passos de 20s compõem a "cauda" do raio
#   (ex: 30 passos = histórico de 10 min). Mais passos = rastro longo = mais
#   arquivos pra baixar. Fica sem efeito se glm_flash_age = False no MAP.
# - glm_history_max_concurrent_downloads: downloads paralelos do histórico
#   dentro de cada worker. O total simultâneo é aproximadamente
#   num_workers x este valor. Se a NOAA começar a recusar ou atrasar
#   requisições, reduza. Arquivo do histórico que falhar vira aviso no
#   relatório final e o frame sai com a cauda incompleta (não há nova tentativa).
#
# dpi: resolução do PNG (mais dpi = imagem maior, mais RAM e mais tempo).
#
# open_video_when_done: True abre o vídeo no player padrão ao terminar (modo V).
#   Use False em servidor, cron ou ambiente sem tela.
#
# delete_temp_images: True apaga, assim que o vídeo é montado, a pasta de frames
# dessa configuração visual dentro de satelite_temp_images (inclusive frames de
# execuções anteriores que ficaram lá). False guarda a pasta: mudando só o
# período, os frames que já existem são reaproveitados. Afeta só essa pasta, os
# caches intermediários de .nc são sempre limpos no final.
[PROCESSING]
num_workers = 2
glm_history_lookback_steps = 30
glm_history_max_concurrent_downloads = 10
dpi = 150
open_video_when_done = True
delete_temp_images = True

# ------------------------------------------------------------------------------
# MAPA E GEOMETRIA
# ------------------------------------------------------------------------------
# Projeção e Coordenadas:
# - projection: P (Plano/Equirretangular) ou C (Curvo/Geostationary).
# - target_coordinates: Oeste, Leste, Sul, Norte (Sul e Oeste são negativos).
#   Nota: Mantenha sempre Oeste < Leste e Sul < Norte pra não bugar o recorte.
#
#   Colinha de recortes prontos (Oeste, Leste, Sul, Norte):
#   São Paulo e região:                -54.5, -41.0, -25.5, -18.0
#   Sul/Sudeste + Uruguai/Argentina:   -61.0, -40.0, -35.5, -18.0
#   Brasil inteiro:                    -74.0, -34.0, -34.0, 6.0
#   América do Sul:                    -90.0, -30.0, -60.0, 15.0
#
# Renderização do GLM (só quando o canal é GLM):
# - glm_flash_age: False mostra só os raios do arquivo GLM do instante pedido
#   (janela de 20s), todos com a cor "default" do colors.ini, sem cauda e sem
#   legenda (as chaves de histórico do bloco PROCESSING ficam sem efeito).
#   True acrescenta a cauda de histórico, com cor e tamanho conforme a idade.
# - glm_background_band: banda de fundo (1-16) ou vazio para "sem fundo".
#   O fundo sempre arredonda para o múltiplo de 10m anterior (até 9m40s de lag).
#   No modo vídeo, com fundo e sem fundo usam pastas de frames separadas em
#   satelite_temp_images, então dá pra alternar sem misturar nada. A barra de
#   cores lateral só existe nas imagens de canal ABI, não no GLM com fundo.
# - glm_flash_marker_min / max: tamanho da bolinha do raio (pt²). Min = raio
#   antigo, Max = raio atual. Se glm_flash_age = False, só usa o valor máximo.
#   (As duas chaves são exigidas mesmo nos canais ABI, mas só afetam o GLM.)
[MAP]
projection = C
target_coordinates = -61.0, -40.0, -35.5, -18.0
glm_flash_age = True
glm_background_band = 2
glm_flash_marker_min = 3
glm_flash_marker_max = 15

# ------------------------------------------------------------------------------
# ESTILO VISUAL
# ------------------------------------------------------------------------------
# Cores e Linhas:
# - Cores aceitam hexadecimais (#RRGGBB) ou nomes do MATPLOTLIB.
#   Cuidado: CSS genérico pode falhar. Na dúvida, use "gray" em vez de "grey"
#   ou apele pro hexadecimal pra não ter erro.
#
# Layout:
# - watermark: texto (aceita qualquer caractere, inclusive %). Deixe vazio
#   para esconder (mas a chave não pode sumir).
# - watermark_size: tamanho da fonte (14 a 24 ficam bons no tamanho padrão).
# - clean_mode: True apaga as margens, legendas e título.
# - figure_width / height: ponto de partida, não a dimensão final exata. O
#   script recalcula a figura pra caber no recorte de target_coordinates,
#   controlando mais a proporção do que a dimensão exata. A fonte do título
#   é fixa (16pt), então aumentar o figure_height deixa a faixa do título
#   proporcionalmente menor no resultado final.
[STYLE]
watermark = PH
watermark_color = #00FF00
watermark_size = 18
clean_mode = False
borders_color = yellow
borders_line_width = 1.5
states_color = cyan
states_line_width = 1.0
coast_color = white
coast_line_width = 1.2
figure_width = 16
figure_height = 14

# ------------------------------------------------------------------------------
# RENDERIZAÇÃO FFMPEG
# ------------------------------------------------------------------------------
# Só valem para generation_type = V (mas as chaves são exigidas sempre).
# - video_scale: resolução (scale=1920:-2 pra 1080p, 2560:-2 pra 1440p).
#   Use -2 na dimensão que deve manter a proporção.
# - crf: compressão, inteiro de 0 a 51 (15 = qualidade boa, 23 = padrão
#   aceitável; quanto menor, maior a qualidade e o arquivo).
# - preset: peso no CPU (ultrafast, superfast, veryfast, faster, fast, medium,
#   slow, slower, veryslow).
[FFMPEG]
video_scale = scale=1920:-2
crf = 15
preset = slow
