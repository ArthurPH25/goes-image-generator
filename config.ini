# ==============================================================================
# CONFIGURAÇÃO DO GERADOR DE IMAGENS DE SATÉLITE GOES-16 / GOES-19
# ==============================================================================
# Regras gerais:
# 1. Todas as chaves usadas pelo produto e pelo modo escolhidos são
#    obrigatórias. Não há valores padrão implícitos. Seções que o modo atual
#    não usa ([VIDEO_TIME] com generation_type = I, [GLM] fora do produto GLM)
#    não são lidas.
# 2. Chaves ausentes, incorretas ou com valores fora do formato esperado
#    interrompem a execução na validação inicial (antes de baixar qualquer coisa).
# 3. Comentários só valem em linhas próprias, começando com #. Comentário na
#    mesma linha do valor não funciona: vira parte do valor e causa erro.
# 4. Salve os arquivos .ini em UTF-8. Cada chave só pode aparecer uma vez por
#    seção.

# ------------------------------------------------------------------------------
# GERAL
# ------------------------------------------------------------------------------
# - product: qual produto renderizar. Valores aceitos (case-insensitive):
#
#   BANDAS ABI INDIVIDUAIS (sempre "C" + 2 dígitos):
#     C01 a C06 -> reflectância (0.47 a 2.24 µm), sempre em tons de cinza.
#     C07 a C16 -> térmico/vapor d'água, com paleta editável em colors.ini.
#
#   IMAGENS MULTIESPECTRAIS:
#     GEOCOLOR       -> composição true-color CIRA-like (dia) / IR realçado (noite)
#     SPLIT_WINDOW   -> diferença C13 - C15 (Split Window Difference)
#
#   COMPOSIÇÕES RGB:
#     AIRMASS              -> Massa de Ar (EUMETSAT)
#     DAY_CLOUD_PHASE      -> Distinção de Fase de Nuvem Diurna (CIRA/NOAA)
#     NIGHT_MICROPHYSICS   -> Microfísica Noturna (EUMETSAT)
#     SEVERE_STORMS        -> Tempestades Severas (EUMETSAT)
#     OVERSHOOTING_TOPS    -> Overshooting Tops (receita experimental, ver colors.ini)
#     FIRE_TEMPERATURE     -> Temperatura do Fogo (CIRA)
#
#   PRODUTOS DE NUVEM (derivados de ABI-L2-ACHAF/CODF/ACTPF, ver colors.ini):
#     CLOUD_TOP_HEIGHT     -> Altura do topo da nuvem (produto oficial NOAA)
#     CLOUD_BASE_HEIGHT    -> Altura da base (ESTIMATIVA, ver aviso em colors.ini)
#     CLOUD_THICKNESS      -> Espessura geométrica (ESTIMATIVA, ver colors.ini)
#
#   RAIOS:
#     GLM  -> Mapeador de Relâmpagos. Todo o comportamento do GLM (modo de
#             renderização, fundo, idade dos raios) é configurado na seção
#             [GLM] mais abaixo, não aqui.
#
# - generation_type: tipo de exportação (I = imagem única em PNG, V = vídeo).
[GENERAL]
product = C13
generation_type = I

# ------------------------------------------------------------------------------
# TEMPO DA IMAGEM ÚNICA
# ------------------------------------------------------------------------------
# Parâmetros para generation_type = I (ignorados no modo vídeo).
#
# Todos os horários são em UTC. Horário de Brasília é UTC-3, então 16:30 em
# Brasília vira 19:30 aqui.
#
# Formato das datas: sempre AAAA-MM-DD.
# Formato de image_time:
# - Todos os produtos, exceto GLM: HH:MM (sem segundos), minutos múltiplos de 10.
# - GLM (product = GLM na seção [GENERAL]): HH:MM:SS (com segundos), segundos
#   múltiplos de 20 (ex: 19:10:20).
# Trocar de/para o produto GLM exige revisar o formato do horário, senão o
# script falha.
#
# Só existem imagens ABI "Full Disk" (disco completo) a cada 10 minutos, no
# modo de escaneamento 6. Períodos mais antigos, de outro modo, não são achados.
# Os produtos derivados (CLOUD_TOP_HEIGHT/CLOUD_BASE_HEIGHT/CLOUD_THICKNESS)
# e as composições RGB seguem o mesmo passo de 10 minutos do ABI, já que usam
# um ou mais arquivos ABI/derivados do mesmo instante.
#
# Se o instante não existir no bucket da NOAA (falha ou manutenção),
# o script encerra com erro fatal (diferente do modo vídeo, que pula
# o frame ausente e segue com os demais).
[IMAGE_TIME]
image_date = 2023-11-03
image_time = 19:10

# ------------------------------------------------------------------------------
# TEMPO DO VÍDEO
# ------------------------------------------------------------------------------
# Parâmetros de intervalo para generation_type = V.
#
# Todos os horários são em UTC (Brasília = UTC-3).
#
# Formato das datas: sempre AAAA-MM-DD.
# Formato de start_time e end_time: mesma regra do HH:MM / HH:MM:SS de
# [IMAGE_TIME], conforme o produto for GLM ou não. Os dois horários precisam
# obrigatoriamente estar no mesmo formato.
#
# fps: taxa de quadros do vídeo.
# Recomendado: 5-10 (análises/GLM) ou 15-30 (períodos longos).
[VIDEO_TIME]
start_date = 2023-11-03
start_time = 18:00
end_date = 2023-11-03
end_time = 20:00
fps = 5

# ------------------------------------------------------------------------------
# PROCESSAMENTO E RECURSOS
# ------------------------------------------------------------------------------
# num_workers: processos paralelos de renderização (CPU e RAM). Cada worker
#   baixa os próprios NetCDF do timestamp (um por banda/produto que a
#   composição escolhida exigir), então num_workers multiplicado pelo número
#   de arquivos do produto é aproximadamente o número de downloads simultâneos.
#   Dimensionamento recomendado:
#   - 8GB RAM: 2 a 4 workers | 16GB RAM: 6 a 8 | 32GB+ RAM: 12+.
#   Produtos RGB e de nuvem baixam vários arquivos por frame (ver tabela de
#   produtos no README): se o processo morrer sozinho, reduza num_workers
#   primeiro, depois dpi / figure_width / figure_height.
#
# Fundo para vídeos GLM: o fundo de cada bloco de 10 minutos é processado
# apenas uma vez e compartilhado em cache, não importa qual produto esteja
# configurado como fundo em [GLM] background. Se tiver muitos workers
# disputando e o lock passar de 5min, o frame sai sem fundo com aviso no
# console. Se isso acontecer, abaixe o num_workers.
#
# Histórico do GLM (só quando product = GLM e [GLM] render_mode = POINTS):
# - glm_history_lookback_steps: quantos passos de 20s compõem a "cauda" do raio
#   (ex: 30 passos = histórico de 10 min). Mais passos = rastro longo = mais
#   arquivos pra baixar. Sem efeito em render_mode = DENSITY ou se
#   flash_age = False.
# - glm_history_max_concurrent_downloads: downloads paralelos do histórico
#   dentro de cada worker. O total simultâneo é aproximadamente
#   num_workers x este valor. Se a NOAA começar a recusar ou atrasar
#   requisições, reduza. Arquivo do histórico que falhar vira aviso no
#   relatório final e o frame sai com a cauda incompleta (não há nova tentativa).
#
# dpi: resolução do PNG (mais dpi = imagem maior, mais RAM e mais tempo).
#
# open_video_when_done: True abre o vídeo no player padrão ao terminar (modo V).
#   Use False em servidor, cron ou ambiente sem tela.
#
# delete_temp_images: True apaga, assim que o vídeo é montado, a pasta de frames
# dessa configuração visual dentro de satelite_temp_images (inclusive frames de
# execuções anteriores que ficaram lá). False guarda a pasta: mudando só o
# período, os frames que já existem são reaproveitados. Afeta só essa pasta, os
# caches intermediários de .nc são sempre limpos no final.
[PROCESSING]
num_workers = 2
glm_history_lookback_steps = 30
glm_history_max_concurrent_downloads = 10
dpi = 150
open_video_when_done = False
delete_temp_images = True

# ------------------------------------------------------------------------------
# MAPA E GEOMETRIA
# ------------------------------------------------------------------------------
# Projeção e Coordenadas:
# - projection: P (Plano/Equirretangular) ou C (Curvo/Geostationary).
# - target_coordinates: Oeste, Leste, Sul, Norte (Sul e Oeste são negativos).
#   Nota: Mantenha sempre Oeste < Leste e Sul < Norte pra não bugar o recorte.
#   O recorte precisa tocar o disco visível pelo GOES-East (de uns -156 a 6 de
#   longitude). Fora disso o script para na validação inicial.
#
#   Colinha de recortes prontos (Oeste, Leste, Sul, Norte):
#   São Paulo e região:                -54.5, -41.0, -25.5, -18.0
#   Sul/Sudeste + Uruguai/Argentina:   -61.0, -40.0, -35.5, -18.0
#   Brasil inteiro:                    -74.0, -34.0, -34.0, 6.0
#   América do Sul:                    -90.0, -30.0, -60.0, 15.0
[MAP]
projection = C
target_coordinates = -61.0, -40.0, -35.5, -18.0

# ------------------------------------------------------------------------------
# GLM (MAPEADOR GEOESTACIONÁRIO DE RELÂMPAGOS)
# ------------------------------------------------------------------------------
# Só é lida/validada quando [GENERAL] product = GLM. Nos demais produtos, esta
# seção é ignorada por completo.
#
# - render_mode: POINTS ou DENSITY.
#   POINTS   -> cada raio vira um ponto, com cor/tamanho por idade. Usa
#               [PALETTE_GLM] em colors.ini.
#   DENSITY  -> grade 2D de contagem de raios por célula, no instante pedido
#               (janela de 20s, sem cauda de histórico). Usa
#               [PALETTE_GLM_DENSITY] em colors.ini. Desenha uma barra de cores
#               lateral (raios por célula), que some com clean_mode = True.
#
# - flash_age: só tem efeito em render_mode = POINTS.
#   False mostra só os raios do arquivo GLM do instante pedido (janela de 20s),
#   todos com a cor "default" de [PALETTE_GLM], sem cauda e sem legenda (as
#   chaves de histórico do bloco [PROCESSING] ficam sem efeito).
#   True acrescenta a cauda de histórico, com cor e tamanho conforme a idade.
#
# - density_grid_resolution_km: só tem efeito em render_mode = DENSITY. Lado
#   de cada célula da grade, em km. Células menores = mapa mais granular, mais
#   lento; células maiores = mais suavizado. 4 a 12 km é uma faixa razoável
#   pro recorte da América do Sul/Brasil.
#
# - background: produto a usar como plano de fundo, ou vazio para "sem fundo".
#   Vazio gera o PNG com fundo transparente de verdade (canal alpha), em
#   qualquer render_mode, com ou sem clean_mode e hide_map_lines. Só o fundo é
#   transparente: raios, linhas do mapa, legenda, título e marca d'água continuam
#   desenhados. Vídeo (MP4) não tem canal alpha: o fundo transparente aparece
#   preto no vídeo; para guardar a transparência use generation_type = I, ou
#   delete_temp_images = False e pegue os PNGs em satelite_temp_images.
#   Aceita QUALQUER product válido da seção [GENERAL] (C01-C16, GEOCOLOR,
#   SPLIT_WINDOW, qualquer RGB ou os produtos de nuvem). Não precisa ser
#   uma banda ABI crua. O fundo sempre arredonda para o múltiplo de 10m
#   anterior ao instante do GLM (até 9m40s de lag). No modo vídeo, cada
#   combinação (produto de fundo + geometria) usa sua própria pasta de cache
#   em satelite_temp_images, então dá pra alternar sem misturar nada. A barra
#   de cores lateral do produto de fundo (quando ele tiver uma) não é
#   desenhada aqui: no GLM ela sai do mapa pra não brigar com a legenda de
#   raios.
#
# - flash_marker_min / max: tamanho da bolinha do raio (pt²). Min = raio
#   antigo, Max = raio atual/mais recente. Se flash_age = False ou
#   render_mode = DENSITY, só usa o valor máximo (DENSITY nem desenha pontos).
[GLM]
render_mode = POINTS
flash_age = True
density_grid_resolution_km = 8
background = C02
flash_marker_min = 3
flash_marker_max = 15

# ------------------------------------------------------------------------------
# ESTILO VISUAL
# ------------------------------------------------------------------------------
# Cores e Linhas:
# - Cores aceitam hexadecimais (#RRGGBB) ou nomes do MATPLOTLIB.
#   Cuidado: CSS genérico pode falhar. Na dúvida, use "gray" em vez de "grey"
#   ou apele pro hexadecimal pra não ter erro.
#
# Layout:
# - watermark: texto (aceita qualquer caractere, inclusive %). Deixe vazio
#   para esconder (mas a chave não pode sumir). A marca d'água é independente de
#   clean_mode e hide_map_lines: só some se este campo estiver vazio.
# - watermark_size: tamanho da fonte (14 a 24 ficam bons no tamanho padrão).
# - clean_mode: True apaga as margens, legendas, barra de cores e título (o mapa
#   ocupa a imagem inteira). Não mexe nas linhas do mapa nem na marca d'água.
# - hide_map_lines: True apaga as linhas de costa, fronteiras e estados e deixa
#   só o produto. Não mexe na marca d'água, no título nem nas legendas (combine
#   com clean_mode = True para tirar tudo), e dispensa o download dos dados de
#   mapa do Cartopy.
# - figure_width / height: ponto de partida, não a dimensão final exata. O
#   script recalcula a figura pra caber no recorte de target_coordinates,
#   controlando mais a proporção do que a dimensão exata. A fonte do título
#   é fixa (16pt), então aumentar o figure_height deixa a faixa do título
#   proporcionalmente menor no resultado final.
[STYLE]
watermark =
watermark_color = #00FF00
watermark_size = 18
clean_mode = False
hide_map_lines = False
borders_color = yellow
borders_line_width = 1.5
states_color = cyan
states_line_width = 1.0
coast_color = white
coast_line_width = 1.2
figure_width = 16
figure_height = 14

# ------------------------------------------------------------------------------
# RENDERIZAÇÃO FFMPEG
# ------------------------------------------------------------------------------
# Só valem para generation_type = V (mas as chaves são exigidas sempre).
# - video_scale: resolução (scale=1920:-2 pra 1080p, 2560:-2 pra 1440p).
#   Use -2 na dimensão que deve manter a proporção.
# - crf: compressão, inteiro de 0 a 51 (15 = qualidade boa, 23 = padrão
#   aceitável; quanto menor, maior a qualidade e o arquivo).
# - preset: peso no CPU (ultrafast, superfast, veryfast, faster, fast, medium,
#   slow, slower, veryslow).
[FFMPEG]
video_scale = scale=1920:-2
crf = 15
preset = slow