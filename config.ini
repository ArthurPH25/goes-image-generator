# ==============================================================================
# CONFIGURAÇÃO DO GERADOR DE IMAGENS DE SATÉLITE GOES-16 / GOES-19
# ==============================================================================
# DIRETRIZES DE FUNCIONAMENTO E FORMATAÇÃO:
# 1. Todas as chaves abaixo são OBRIGATÓRIAS. Não há valor padrão implícito
#    para nenhuma delas: se uma chave estiver ausente, com o nome errado, ou
#    com um valor fora do formato esperado, o script para imediatamente com
#    erro. Isso é proposital, não existe "modo tolerante".
# 2. As chaves devem respeitar rigorosamente os formatos e tipos indicados
#    em cada seção abaixo.
# ==============================================================================

# ==============================================================================
# GERAL
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - channel: Banda (1 a 16) ou 'GLM' para o Geostationary Lightning Mapper.
# - generation_type: I (Imagem Única) ou V (Vídeo)
# ==============================================================================
[GENERAL]
channel = 13
generation_type = I

# ==============================================================================
# TEMPO DA IMAGEM ÚNICA
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - Utilizado apenas se generation_type = I. A imagem única sempre é
#   exportada como PNG (não usa fps nem nenhuma chave de [VIDEO_TIME]).
# - Formato: AAAA-MM-DD para a data.
# - Se canal ABI: image_time no formato HH:MM (SEM segundos), minutos
#   múltiplos de 10. Ex.: 19:10 é válido; 19:10:00 é ERRO (imagem não tem
#   segundos); 19:15 é ERRO (não é múltiplo de 10).
# - Se canal GLM: image_time no formato HH:MM:SS (COM segundos), segundos
#   múltiplos de 20. Ex.: 19:10:20 é válido; 19:10 é ERRO (GLM exige
#   segundos explícitos); 19:10:15 é ERRO (não é múltiplo de 20).
# - ATENÇÃO CRÍTICA: o formato de image_time DEPENDE do valor de
#   [GENERAL] channel. Ou seja, ao trocar o canal (ABI <-> GLM) você
#   PRECISA revisar image_time (e, se generation_type = V, também
#   start_time/end_time em [VIDEO_TIME]) para o novo formato correspondente
#   -- caso contrário o script para com erro de formato na validação
#   inicial. O valor de image_time abaixo (19:10:00, COM segundos) só é
#   válido enquanto channel = GLM. Se você mudar channel para uma banda
#   ABI (1 a 16), troque também image_time para o formato HH:MM (ex:
#   19:10), removendo os segundos.
# - ATENÇÃO: "múltiplo de 10/20" é uma condição NECESSÁRIA mas não
#   SUFICIENTE. O satélite pode ter falhado em capturar aquele instante
#   específico (falha de scan, manutenção, etc.). Se isso acontecer, o
#   script não trava: ele reporta "arquivo não encontrado no bucket" para
#   aquele horário e, no modo vídeo, simplesmente pula o frame. Não é erro
#   de configuração, é ausência de dado na NOAA.
# ==============================================================================
[IMAGE_TIME]
image_date = 2026-09-12
image_time = 05:30

# ==============================================================================
# TEMPO DO VÍDEO
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - Utilizado apenas se generation_type = V.
# - start_time/end_time seguem a MESMA regra de formato de [IMAGE_TIME]:
#   ABI usa HH:MM (sem segundos, minutos múltiplos de 10); GLM usa HH:MM:SS
#   (com segundos, múltiplos de 20). Misturar o formato errado é erro.
# - Mesma ATENÇÃO CRÍTICA de [IMAGE_TIME]: o formato correto depende do
#   canal ativo em [GENERAL] channel. Ao trocar o canal, revise
#   start_time E end_time juntos (os dois precisam estar no mesmo
#   formato, coerente com o canal novo).
# - Canais ABI pulam a cada 10 minutos. Canal GLM pula a cada 20 segundos.
# - fps: 5-10 (análise detalhada) ou 15-30 (longos períodos). Esta chave SÓ
#   é lida quando generation_type = V; no modo imagem única (I) ela é
#   ignorada e não existe fps configurável (não se aplica a uma imagem só).
# ==============================================================================
[VIDEO_TIME]
start_date = 2023-11-03
start_time = 12:00:00
end_date = 2023-11-03
end_time = 22:00:00
fps = 10

# ==============================================================================
# PROCESSAMENTO E RECURSOS
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - num_workers: quantos PROCESSOS paralelos renderizam frames (CPU-bound).
#   2 a 4 (8GB RAM), 6 a 8 (16GB RAM), 12+ (32GB+ RAM).
#   ATENÇÃO - vídeo de GLM com glm_background_band preenchido: o fundo ABI
#   de cada bloco de 10 minutos é baixado/processado UMA VEZ e
#   compartilhado entre todos os frames GLM (20 em 20s) daquele bloco, via
#   um cache em disco com trava (lock) entre workers. Se vários workers
#   caírem no mesmo bloco de 10 minutos ao mesmo tempo, só um gera o
#   fundo; os demais esperam. Se essa espera passar de 5 minutos (fundo
#   muito lento ou travado), o worker desiste e gera aquele frame SEM
#   fundo, silenciosamente (só aparece um aviso no console, o script não
#   para). Com num_workers muito alto essa concorrência aumenta; se
#   perceber frames sem fundo intercalados no vídeo final, tente reduzir
#   num_workers.
# - max_concurrent_downloads: quantos arquivos .nc cada worker baixa ao mesmo
#   tempo via asyncio (I/O-bound, não consome CPU/RAM como um processo).
#   Isso é independente de num_workers. GLM é leve, então 12-20 costuma ser
#   um bom ponto de partida; valores muito altos podem esbarrar em
#   throttling do bucket S3 da NOAA.
# - glm_history_lookback_steps: só é USADO quando glm_flash_age = True, mas a
#   chave é sempre obrigatória. Quantos passos de 20s pro passado o rastro de
#   raios olha (30 = até 10 minutos de histórico). Mais passos = rastro mais
#   longo, porém mais arquivos pra buscar/baixar por frame.
# - glm_history_max_concurrent_downloads: só é USADO quando glm_flash_age =
#   True, mas a chave é sempre obrigatória. Quantos arquivos históricos do
#   rastro de raios cada frame baixa concorrentemente (independente de
#   max_concurrent_downloads acima, que é só pro arquivo principal/fundo).
# - dpi: 150 a 300+ (Qualidade da renderização).
# - delete_temp_images: True limpa os PNGs temporários do vídeo no final, False 
# guarda o cache.
# ==============================================================================
[PROCESSING]
num_workers = 2
max_concurrent_downloads = 16
glm_history_lookback_steps = 30
glm_history_max_concurrent_downloads = 10
dpi = 150
delete_temp_images = True

# ==============================================================================
# MAPA E GEOMETRIA
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - projection: P (Plano/Equirretangular) ou C (Curvo/Geostationary).
# - target_coordinates: Oeste, Leste, Sul, Norte (Valores Sul/Oeste são 
# negativos). ATENÇÃO: diferente de quase toda outra chave deste arquivo,
# esta NÃO é validada quanto à ordem/sanidade dos valores — o script só
# confere se são 4 números. Se você inverter Oeste/Leste ou Sul/Norte (ex:
# escrever Leste antes de Oeste), o script NÃO para com erro claro aqui;
# o recorte de área e o mapa saem incorretos/distorcidos mais adiante.
# Sempre confira: primeiro valor < segundo valor (Oeste < Leste) e
# terceiro valor < quarto valor (Sul < Norte).
# - glm_flash_age: Apenas para GLM, mas a chave é sempre obrigatória.
#   False: mostra SOMENTE os raios do instante exato do frame, todos com a
#   mesma cor ("default" do colors.ini), sem rastro/trilha e sem legenda.
#   As chaves glm_history_lookback_steps e glm_history_max_concurrent_
#   downloads (seção [PROCESSING]) ficam sem efeito nesse modo: nenhum
#   arquivo histórico é baixado.
#   True: além do instante exato, busca e baixa também os frames anteriores
#   (controlado por glm_history_lookback_steps), traçando um rastro de
#   raios com cor E tamanho decrescentes conforme a idade (gradiente do
#   colors.ini), com legenda de faixas de tempo no canto do mapa.
# - glm_background_band: Qual canal do satélite ficará no fundo do GLM (ex: 2,
#   13). Assim como watermark (ver seção ESTILO VISUAL abaixo), esta chave
#   aceita o valor VAZIO como opção válida e com significado próprio: "sem
#   fundo". Não é um valor omitido, é uma opção explícita, a chave em si
#   continua obrigatória (precisa existir no arquivo).
#   ATENÇÃO - defasagem de tempo entre o raio e o fundo: o ABI só captura a
#   cada 10 minutos (minutos 00, 10, 20...), mas o GLM captura a cada 20
#   segundos. Por isso o fundo usado NUNCA é do mesmo instante exato do
#   raio (exceto quando o GLM cai exatamente em cima de um múltiplo de
#   10): o script sempre arredonda o horário do GLM PARA TRÁS até o
#   múltiplo de 10 anterior (ex.: um raio às 19:19:40 usa o fundo ABI das
#   19:10, NUNCA o das 19:20). Isso significa que a imagem de fundo pode
#   estar até 9min40s "atrasada" em relação ao raio mostrado sobre ela.
#   Isso é sempre assim, não é uma falha ocasional nem depende de
#   glm_flash_age: é a regra normal de correspondência entre os dois
#   canais. Na prática, o fundo (nuvens) pode ter se movido visivelmente
#   entre o horário mostrado no fundo e o horário exato do raio, o que é
#   esperado e não indica erro de configuração ou bug.
#   ATENÇÃO - nome do arquivo de saída: quando esta chave NÃO está vazia,
#   o PNG (e os frames de vídeo) gerados ganham o sufixo "_CXX" no nome
#   (ex.: ..._C02.png). Se você alternar entre usar e não usar fundo para
#   o mesmo canal/horário, os arquivos gerados terão nomes diferentes e
#   NÃO vão se sobrescrever — o cache de frames de vídeo (pasta
#   satelite_temp_images) pode acumular versões com e sem fundo do mesmo
#   instante se você mudar esta chave no meio de testes.
#   ATENÇÃO - validação tardia: diferente da maioria das chaves deste
#   arquivo (validadas todas de uma vez no início), um valor inválido aqui
#   (fora de 1-16, ou não numérico) só é detectado DEPOIS que o arquivo
#   GLM principal daquele instante já foi baixado, um download
#   desperdiçado por frame. Confira o valor com atenção antes de rodar,
#   especialmente em modo vídeo com muitos frames.
# - glm_flash_marker_min / glm_flash_marker_max: tamanho (em pontos²,
#   parâmetro "s" do scatter) da bolinha de cada raio no mapa. Ambas são
#   sempre obrigatórias e devem ser números positivos, com min <= max.
#   Se glm_flash_age = True: o raio mais recente (idade 0) usa
#   glm_flash_marker_max, e o tamanho diminui linearmente até
#   glm_flash_marker_min no raio mais antigo do histórico (borda de
#   glm_history_lookback_steps), reforça visualmente que raios recentes se
#   destacam mais que os antigos.
#   Se glm_flash_age = False: não há idade rastreada, então todos os raios
#   usam um tamanho único e fixo, igual a glm_flash_marker_max
#   (glm_flash_marker_min é ignorado nesse caso, mas a chave continua
#   obrigatória). Sugestão de ponto de partida: min = 3, max = 15.
# ==============================================================================
[MAP]
projection = C
target_coordinates = -61.0, -40.0, -35.5, -18.0
glm_flash_age = True
glm_background_band = 2
glm_flash_marker_min = 3
glm_flash_marker_max = 15

# ==============================================================================
# ESTILO VISUAL
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - Cores: Nome em inglês ou Hexadecimal. Espessuras (line_width) entre 0.5 e 
# 1.5+. Os nomes em inglês são os nomes de cor do MATPLOTLIB, não CSS
# genérico (ex: "darkgray" ou "dimgray" funcionam, "darkgrey"/"slategrey"
# com "grey" no lugar de "gray" podem não existir dependendo da variante).
# Na dúvida, use hexadecimal (#RRGGBB), que sempre funciona.
# - clean_mode: True remove título, legenda e margens pretas.
# - watermark: pode ficar com valor vazio (sem marca d'água), mas a chave em
#   si precisa existir no arquivo.
# - watermark_color: cor da marca d'água. Nome em inglês ou Hexadecimal,
#   igual às outras cores desta seção. Só é usada se watermark não estiver
#   vazio, mas a chave em si é sempre obrigatória.
# - watermark_size: tamanho da fonte da marca d'água, em pontos. Só é usada
#   se watermark não estiver vazio, mas a chave em si é sempre obrigatória.
#   Sugestão: 14 a 24 para o tamanho padrão de figura (16x14 pol).
# - figure_width / figure_height: tamanho da figura em polegadas antes do
#   dpi ser aplicado (afeta proporção e resolução final da imagem/vídeo).
#   ATENÇÃO: a faixa de título (quando clean_mode = False) tem uma altura
#   FIXA em polegadas (baseada num tamanho de fonte interno do script, não
#   configurável aqui). Isso significa que ela ocupa uma FRAÇÃO diferente
#   da imagem dependendo de figure_height: em uma figura baixa (ex:
#   figure_height pequeno) o título ocupa uma fatia visualmente maior do
#   quadro; em uma figura alta, uma fatia menor. Se o título parecer
#   desproporcional (grande ou pequeno demais) depois de mudar
#   figure_width/figure_height, isso é esperado — ajuste figure_height
#   até o equilíbrio visual desejado, não há uma chave separada para o
#   tamanho da faixa de título.
# ==============================================================================
[STYLE]
watermark = PH
watermark_color = #00FF00
watermark_size = 18
clean_mode = False
borders_color = yellow
borders_line_width = 1.5
states_color = cyan
states_line_width = 1.0
coast_color = white
coast_line_width = 1.2
figure_width = 16
figure_height = 14

# ==============================================================================
# RENDERIZAÇÃO FFMPEG
# ==============================================================================
# REFERÊNCIA BÁSICA:
# - video_scale: scale=1920:-2 (1080p), 2560:-2 (1440p) ou 3840:-2 (4K).
# - crf: 15 (Alta qualidade) a 23 (Padrão de compressão).
# - preset: Velocidade da CPU (ultrafast, superfast, veryfast, fast, medium, 
# slow).
# ==============================================================================
[FFMPEG]
video_scale = scale=1920:-2
crf = 15
preset = slow