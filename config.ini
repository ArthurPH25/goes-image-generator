# ==============================================================================
# GOES-16 / GOES-19 SATELLITE IMAGE GENERATOR CONFIGURATION
# ==============================================================================
# General rules:
# 1. Every key used by the chosen product and mode is required. There are no
#    implicit default values. Sections the current mode does not use
#    ([TIME_RANGE] with generation_type = I, [GLM] outside the GLM product)
#    are not read.
# 2. Missing or incorrect keys, or values outside the expected format, stop
#    the run during the initial validation (before anything is downloaded).
# 3. Comments only work on their own lines, starting with #. A comment on the
#    same line as a value does not work: it becomes part of the value and
#    causes an error.
# 4. Save the .ini files as UTF-8. Each key may appear only once per section.
# 5. Only two folders are used, both created next to main.py when needed:
#    output/ (everything you keep: images, sequences and videos) and temp/
#    (downloads, caches and video frames). temp/ is emptied at the end of each
#    run and removed when nothing is left in it. The only exception is a video
#    run that dies before the video is assembled: its frames stay in temp/ so
#    the next run with the same visual settings continues from them. To get
#    the frames themselves, use generation_type = S.

# ------------------------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------------------------
# - product: which product to render. Accepted values (case-insensitive):
#
#   INDIVIDUAL ABI BANDS (always "C" + 2 digits):
#   - C01 to C06: reflectance (0.47 to 2.24 µm), always grayscale.
#   - C07 to C16: thermal/water vapor, with an editable palette in colors.ini.
#
#   MULTISPECTRAL IMAGES:
#   - GEOCOLOR: CIRA-like true-color composite (day) / enhanced IR (night).
#   - SPLIT_WINDOW: C13 - C15 difference (Split Window Difference).
#
#   RGB COMPOSITES:
#   - AIRMASS: Air Mass (EUMETSAT).
#   - DAY_CLOUD_PHASE: Day Cloud Phase Distinction (CIRA/NOAA).
#   - NIGHT_MICROPHYSICS: Night Microphysics (NOAA/CIRA, ABI version).
#   - SEVERE_STORMS: Severe Storms (EUMETSAT).
#   - OVERSHOOTING_TOPS: Overshooting Tops (experimental recipe, see
#     colors.ini).
#   - FIRE_TEMPERATURE: Fire Temperature (CIRA).
#
#   CLOUD PRODUCTS (derived from ABI-L2-ACHAF/CODF/ACTPF, see colors.ini):
#   - CLOUD_TOP_HEIGHT: Cloud top height (official NOAA product).
#   - CLOUD_BASE_HEIGHT: Base height (ESTIMATE, see the warning in colors.ini).
#   - CLOUD_THICKNESS: Geometric thickness (ESTIMATE, see colors.ini).
#
#   LIGHTNING:
#   - GLM: Geostationary Lightning Mapper. All GLM behavior (render mode,
#     background, flash age) is configured in the [GLM] section further down,
#     not here.
#
# - generation_type: export type.
#   - I: single image (saved to output/, in the image_format set in
#     [PROCESSING]).
#   - V: MP4 video (saved to output/).
#   - S: image sequence, several images from a period (in the image_format set
#     in [PROCESSING]), no video. Everything is saved to its own folder inside
#     output/, e.g.:
#     output/C13_20231103_1800_to_20231103_2000/
#     Each run creates a new folder (it never mixes with or overwrites
#     previous ones). Use this mode if you only want the images, without
#     going through the video.
[GENERAL]
product = C13
generation_type = I

# ------------------------------------------------------------------------------
# SINGLE IMAGE TIME
# ------------------------------------------------------------------------------
# Parameters for generation_type = I (ignored in modes V and S).
#
# All times are in UTC. Brasília time is UTC-3, so 16:30 in Brasília becomes
# 19:30 here.
#
# - image_date: format YYYY-MM-DD.
#
# - image_time: the format depends on the product.
#   - All products except GLM: HH:MM (no seconds), minutes that are multiples
#     of 10.
#   - GLM (product = GLM in the [GENERAL] section): HH:MM:SS (with seconds),
#     seconds that are multiples of 20 (e.g. 19:10:20).
#   Switching to/from the GLM product requires revising the time format,
#   otherwise the script fails.
#
# Only ABI "Full Disk" images exist every 10 minutes, in scan mode 6. Older
# periods, from a different mode, are not found.
# The derived products (CLOUD_TOP_HEIGHT/CLOUD_BASE_HEIGHT/CLOUD_THICKNESS)
# and the RGB composites follow the same 10-minute ABI step, since they use
# one or more ABI/derived files from the same instant.
#
# If the instant does not exist in the NOAA bucket (outage or maintenance),
# the script exits with a fatal error (unlike modes V and S, which skip the
# missing frame and continue with the others).
[IMAGE_TIME]
image_date = 2023-11-03
image_time = 20:30

# ------------------------------------------------------------------------------
# PERIOD (VIDEO OR IMAGE SEQUENCE)
# ------------------------------------------------------------------------------
# Interval parameters for generation_type = V (video) or S (image sequence).
# Ignored with generation_type = I.
#
# All times are in UTC (Brasília = UTC-3).
#
# - start_date / end_date: format YYYY-MM-DD.
#
# - start_time / end_time: same HH:MM / HH:MM:SS rule as [IMAGE_TIME],
#   depending on whether the product is GLM or not. Both times must be in
#   the same format.
#
# - fps: video frame rate. Only used with generation_type = V (in mode S the
#   value is ignored, you can leave it as is). Recommended: 5-10
#   (analysis/GLM) or 15-30 (long periods).
[TIME_RANGE]
start_date = 2023-11-03
start_time = 18:00
end_date = 2023-11-03
end_time = 20:00
fps = 5

# ------------------------------------------------------------------------------
# PROCESSING AND RESOURCES
# ------------------------------------------------------------------------------
# - num_workers: parallel rendering processes (CPU and RAM). Each worker
#   downloads its own NetCDF files for the timestamp (one per band/product the
#   chosen composite requires), so num_workers multiplied by the number of
#   files for the product is roughly the number of simultaneous downloads.
#   Recommended sizing:
#   - 8GB RAM: 2 to 4 workers | 16GB RAM: 6 to 8 | 32GB+ RAM: 12+.
#   RGB and cloud products download several files per frame (see the product
#   table in the README): if the process dies on its own, reduce num_workers
#   first, then dpi / figure_width / figure_height.
#   GLM background in video or sequence mode: the background of each
#   10-minute block is processed only once and shared through a cache, no
#   matter which product is set as the background in [GLM] background. If
#   many workers compete and the lock takes more than 5 minutes, the frame
#   is produced without a background and a warning is shown in the console.
#   If that happens, lower num_workers.
#
# - glm_history_lookback_steps: only with product = GLM and [GLM] render_mode =
#   POINTS. How many 20 s steps make up the flash "tail" (e.g. 30 steps = 10
#   min of history). More steps = longer trail = more files to download.
#   Has no effect with render_mode = DENSITY or if flash_age = False.
#
# - glm_history_max_concurrent_downloads: only with product = GLM and [GLM]
#   render_mode = POINTS. Parallel history downloads inside each worker. The
#   total number of simultaneous downloads is roughly num_workers x this
#   value. If NOAA starts refusing or delaying requests, reduce it. A history
#   file that fails becomes a warning in the final report and the frame is
#   produced with an incomplete tail (there is no retry).
#
# - dpi: image resolution (more dpi = larger image, more RAM and more time).
#
# - image_format: format of the files exported in modes I and S. Accepted
#   values (case-insensitive): png, webp, jpg (or jpeg), tiff (or tif).
#   The file is written directly in the chosen format, with no conversion
#   afterwards.
#   - png: lossless, with transparency. Larger files.
#   - webp: much smaller than PNG, with transparency. Saved with lossy
#     compression (Pillow default quality).
#   - jpg: small, lossy and WITHOUT transparency. Cannot be used with
#     product = GLM and an empty [GLM] background (transparent background):
#     the initial validation stops with an error.
#   - tiff: lossless, with transparency, very large files.
#   In mode V (video) this key is ignored (but the key is always required):
#   the intermediate frames are always PNG, so the video is not degraded.
#
# - open_video_when_done: True opens the video in the default player when
#   finished (mode V only). Use False on a server, cron job or screenless
#   environment.
#
[PROCESSING]
num_workers = 2
glm_history_lookback_steps = 30
glm_history_max_concurrent_downloads = 10
dpi = 150
image_format = png
open_video_when_done = False

# ------------------------------------------------------------------------------
# MAP AND GEOMETRY
# ------------------------------------------------------------------------------
# - projection: P (Flat/Equirectangular) or C (Curved/Geostationary).
#
# - target_coordinates: West, East, South, North (South and West are negative).
#   Note: always keep West < East and South < North so the crop does not break.
#   The crop must touch the disk visible from GOES-East (roughly longitudes
#   -156 to 6). Outside that, the script stops at the initial validation.
#   Cheat sheet of ready-made crops (West, East, South, North):
#   - São Paulo and surroundings: -54.5, -41.0, -25.5, -18.0
#   - South/Southeast Brazil + Uruguay/Argentina: -61.0, -40.0, -35.5, -15.0
#   - All of Brazil: -74.0, -34.0, -34.0, 6.0
#   - South America: -90.0, -30.0, -60.0, 15.0
[MAP]
projection = C
target_coordinates = -61.0, -40.0, -35.5, -15.0

# ------------------------------------------------------------------------------
# GLM (GEOSTATIONARY LIGHTNING MAPPER)
# ------------------------------------------------------------------------------
# Only read/validated when [GENERAL] product = GLM. For all other products
# this section is ignored entirely.
#
# - render_mode: POINTS or DENSITY.
#   - POINTS: each flash becomes a point, with color/size by age. Uses
#     [PALETTE_GLM] in colors.ini.
#   - DENSITY: 2D grid of flash counts per cell, at the requested instant
#     (20 s window, no history tail). Uses [PALETTE_GLM_DENSITY] in
#     colors.ini. Draws a side colorbar (flashes per cell), which disappears
#     with clean_mode = True.
#
# - flash_age: only has an effect with render_mode = POINTS.
#   - False: shows only the flashes from the GLM file of the requested
#     instant (20 s window), all in the "default" color of [PALETTE_GLM],
#     with no tail and no legend (the history keys in the [PROCESSING] block
#     have no effect).
#   - True: adds the history tail, with color and size according to age.
#
# - density_grid_resolution_km: only has an effect with render_mode =
#   DENSITY. Side length of each grid cell, in km. Smaller cells = more
#   granular map, slower; larger cells = smoother. 4 to 12 km is a reasonable
#   range for the South America/Brazil crops.
#
# - background: product to use as the background layer, or empty for "no
#   background". Empty produces a truly transparent PNG background (alpha
#   channel), in any render_mode, with or without clean_mode and
#   hide_map_lines. Only the background is transparent: flashes, map lines,
#   legend, title and watermark are still drawn. Video (MP4) has no alpha
#   channel: the transparent background appears black in the video; to keep
#   the transparency use generation_type = I (PNG in output/) or S (PNGs in
#   their own folder inside output/).
#   Accepts ANY valid product from the [GENERAL] section (C01-C16, GEOCOLOR,
#   SPLIT_WINDOW, any RGB or the cloud products). It does not need to be a
#   raw ABI band. The background always rounds down to the previous multiple
#   of 10 minutes from the GLM instant (up to 9m40s of lag). In video mode,
#   each combination (background product + geometry + palette) gets its own
#   cache file in temp/, so you can switch between them without mixing
#   anything. The background product's side colorbar (when it has one,
#   e.g. °C for C13) is drawn to the right of the map; in DENSITY, the
#   flashes-per-cell bar comes right after it. The flash age legend (POINTS)
#   sits inside the map, in the lower-left corner. Everything disappears
#   with clean_mode = True.
#
# - flash_marker_min / max: flash marker size (pt²). Min = old flash, Max =
#   current/most recent flash. If flash_age = False or render_mode =
#   DENSITY, only the maximum value is used (DENSITY does not even draw
#   points).
[GLM]
render_mode = POINTS
flash_age = True
density_grid_resolution_km = 8
background = C02
flash_marker_min = 3
flash_marker_max = 15

# ------------------------------------------------------------------------------
# VISUAL STYLE
# ------------------------------------------------------------------------------
# - Colors (borders_color, states_color, coast_color, watermark_color): accept
#   hex codes (#RRGGBB) or MATPLOTLIB names. Careful: generic CSS names may
#   fail. When in doubt, use "gray" instead of "grey" or go with the hex code
#   to avoid errors.
#
# - watermark: text (accepts any character, including %). Leave empty to hide
#   it (but the key must not be removed). The watermark is independent of
#   clean_mode and hide_map_lines: it only disappears if this field is empty.
#
# - watermark_size: font size (14 to 24 look good at the default size).
#
# - clean_mode: True removes the margins, legends, colorbar and title (the map
#   fills the whole image). Does not affect the map lines or the watermark.
#
# - hide_map_lines: True removes the coastlines, borders and state lines and
#   leaves only the product. Does not affect the watermark, title or legends
#   (combine with clean_mode = True to remove everything), and skips the
#   download of the Cartopy map data.
#
# - figure_width / height: a starting point, not the exact final size. The
#   script recalculates the figure to fit the target_coordinates crop,
#   controlling the aspect ratio more than the exact size. The title font is
#   fixed (16pt), so increasing figure_height makes the title band
#   proportionally smaller in the final result.
[STYLE]
watermark =
watermark_color = #00FF00
watermark_size = 18
clean_mode = False
hide_map_lines = False
borders_color = yellow
borders_line_width = 1.5
states_color = cyan
states_line_width = 1.0
coast_color = white
coast_line_width = 1.2
figure_width = 16
figure_height = 14

# ------------------------------------------------------------------------------
# FFMPEG RENDERING
# ------------------------------------------------------------------------------
# Only apply to generation_type = V; in modes I and S they are ignored (but
# the keys are always required).
#
# - video_scale: resolution (scale=1920:-2 for 1080p, 2560:-2 for 1440p).
#   Use -2 for the dimension that should keep the aspect ratio.
#
# - crf: compression, integer from 0 to 51 (15 = good quality, 23 = acceptable
#   default; the lower the value, the higher the quality and the file size).
#
# - preset: CPU load (ultrafast, superfast, veryfast, faster, fast, medium,
#   slow, slower, veryslow).
[FFMPEG]
video_scale = scale=1920:-2
crf = 15
preset = slow